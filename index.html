<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>부동산 자산 디지털 플랫폼 (Real8)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        /* 정린님의 세련된 다크 모드 디자인 그대로 유지 */
        body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .login-card { max-width: 400px; margin: 100px auto; padding: 30px; background: #1e1e1e; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; }
        button { width: 95%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-yellow { background: #fee500; color: #3c1e1e; }
        .btn-blue { background: #007bff; color: white; }
        .hidden { display: none; }
        #main-app { padding: 20px; border: 1px solid #333; border-radius: 15px; background: #1e1e1e; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>Real8 플랫폼</h2>
            <p>보안을 위해 로그인이 필요합니다.</p>
            <input type="text" id="login-id" placeholder="이메일 아이디 (abc@naver.com)">
            <input type="password" id="login-pw" placeholder="비밀번호 (6자리 이상)">
            
            <button class="btn-yellow" onclick="handleSignUp()">🌟 신규 회원가입</button>
            <button class="btn-blue" onclick="handleLogin()">기존 회원 로그인</button>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <h1>🏠 부동산 관리자 대시보드</h1>
        <p>환영합니다! 정린님의 부동산 플랫폼에 접속하셨습니다.</p>
        <hr style="border: 0.5px solid #333;">
        <div style="padding: 20px; background: #2a2a2a; border-radius: 10px;">
            <h3>현재 등록된 매물: 0건</h3>
            <button style="width: auto; padding: 10px 20px; background: #28a745; color: white;">+ 새 매물 등록하기</button>
        </div>
    </div>

    <script>
        // 정린님만의 구글 서버 열쇠 (사진 64번)
        var firebaseConfig = {
            apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
            authDomain: "real8-bc.firebaseapp.com",
            projectId: "real8-bc",
            appId: "1:792768508652:web:14557cae750168f46c6bc9"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // [회원가입 기능]
        function handleSignUp() {
            const email = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            auth.createUserWithEmailAndPassword(email, pw)
                .then(() => alert("가입 성공! 이제 로그인 버튼을 눌러주세요."))
                .catch(err => alert("에러: " + err.message));
        }

        // [로그인 및 화면전환 기능]
        function handleLogin() {
            const email = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            auth.signInWithEmailAndPassword(email, pw)
                .then(() => {
                    alert("로그인 성공! 대시보드로 이동합니다.");
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                })
                .catch(err => alert("로그인 실패: " + err.message));
        }
    </script>
</body>
</html>
