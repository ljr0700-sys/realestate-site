<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 Platform - 통합 자산 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* [1] 로그인 대문 - 어제 저녁 디자인 반영 */
        body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: #000; color: #fff; }
        #auth-gate { background: #f5f6f7; height: 100vh; display: flex; align-items: center; justify-content: center; position: fixed; width: 100%; z-index: 9999; }
        .login-box { background: #fff; padding: 45px; border: 1px solid #ddd; border-radius: 12px; width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .login-box h1 { color: #03c75a; font-size: 35px; margin-bottom: 30px; }
        .login-box input { width: 100%; padding: 15px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; color: #000; font-size: 16px; }
        .btn-green { width: 100%; padding: 16px; background: #03c75a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 18px; }
        .hidden { display: none !important; }

        /* [2] 정린님의 어제 저녁 원본 디자인 (사진 22장 분량 완벽 복구) */
        .header-blue { background: #2b579a; padding: 18px 25px; display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; }
        .menu-bar { background: #1a1a1a; display: flex; border-bottom: 1px solid #333; }
        .menu-item { padding: 15px 25px; font-size: 14px; color: #fff; cursor: pointer; border-right: 1px solid #222; }
        .menu-active { background: #fee500; color: #000; font-weight: bold; }
        
        .page-content { padding: 40px; max-width: 1100px; display: none; }
        .show { display: block !important; }
        
        /* 사진 113번 설정창 디자인 */
        .admin-card { border: 1px solid #fee500; padding: 30px; border-radius: 5px; background: #0a0a0a; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; }
        .field-label { display: block; font-size: 13px; color: #fee500; margin-bottom: 8px; }
        .field-input { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 12px; font-size: 16px; }
        .btn-post { background: #007bff; color: white; border: none; padding: 18px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 25px; }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="login-box">
        <h1>Real8</h1>
        <input type="email" id="email" placeholder="이메일 주소">
        <input type="password" id="pw" placeholder="비밀번호">
        <button class="btn-green" onclick="handleAuth(false)">로그인하기</button>
        <button class="btn-green" style="background:#ffc107; color:#000; margin-top:8px;" onclick="handleAuth(true)">신규 회원가입</button>
    </div>
</div>

<div id="main-system" class="hidden">
    <div class="header-blue">
        <span>Real8 Platform (Server)</span>
        <div style="font-size:12px; font-weight:normal;">
            <span id="user-display" style="color:#fee500;"></span>님 접속 중 | <button onclick="location.reload()" style="background:none; border:none; color:#fff; cursor:pointer;">로그아웃</button>
        </div>
    </div>
    
    <div class="menu-bar">
        <div class="menu-item" onclick="changePage('p-home', this)">홈·안내</div>
        <div class="menu-item menu-active" onclick="changePage('p-token', this)">블록체인·토큰코인</div>
        <div class="menu-item" onclick="changePage('p-build', this)">건축·매매·임대·펜션</div>
        <div class="menu-item" onclick="changePage('p-virtual', this)">가상건축</div>
        <div class="menu-item" onclick="changePage('p-culture', this)">주거문화</div>
        <div class="menu-item" onclick="changePage('p-my', this)">마이페이지</div>
    </div>

    <div id="p-home" class="page-content">
        <div class="admin-card">
            <h3>사이트 이용 안내 (서버 연동)</h3>
            <p>• 정린님의 모든 공시 정보는 구글 서버에 실시간 저장됩니다.</p>
        </div>
    </div>

    <div id="p-token" class="page-content show">
        <div class="admin-card">
            <h2>토큰/코인 발행 기준 및 관리</h2>
            <div style="margin-top:20px; padding:15px; background:#1a1a1a;">
                <label class="field-label">📍 해시 연계용 부동산 주소 (재료 1)</label>
                <input type="text" id="addr" value="경기도 가평군 설악면" class="field-input" style="border:none; border-bottom:1px solid #444;">
            </div>
            <div class="input-grid">
                <div class="field"><label class="field-label">부동산 등록 지급량</label><input type="text" id="v1" value="500" class="field-input"></div>
                <div class="field"><label class="field-label">배당 수익률 (%)</label><input type="text" id="v2" value="3.5" class="field-input"></div>
            </div>
            <button class="btn-post" onclick="doHash()">설정 저장 및 블록체인 해시 공시</button>
            <div id="hash-view" style="margin-top:20px; color:#00ff00; font-family:monospace; word-break:break-all;"></div>
        </div>
    </div>

    <div id="p-build" class="page-content">
        <div class="admin-card">
            <h2>부동산 정보 등록</h2>
            <label class="field-label">1. 거래 종류</label>
            <select class="field-input"><option>건축</option><option>매매</option></select>
            <label class="field-label" style="margin-top:15px;">4. 주소 입력</label>
            <input type="text" class="field-input" placeholder="주소를 입력하세요">
            <button class="btn-post" style="background:#28a745;">정보 등록</button>
        </div>
    </div>

    <div id="p-virtual" class="page-content">
        <div class="admin-card">
            <h2>가상건축 프로젝트 제안</h2>
            <input type="text" class="field-input" placeholder="제안 제목" style="margin-bottom:10px;">
            <textarea class="field-input" style="height:100px;" placeholder="상세 제안 내용을 입력하세요"></textarea>
            <button class="btn-post">제안 제출</button>
        </div>
    </div>

    <div id="p-culture" class="page-content">
        <div class="admin-card">
            <h2>주거문화 정보 공유</h2>
            <textarea class="field-input" style="height:150px;" placeholder="주거 경험을 공유해 주세요"></textarea>
            <button class="btn-post">글 등록</button>
        </div>
    </div>

    <div id="p-my" class="page-content">
        <div class="admin-card">
            <h2>마이페이지</h2>
            <p>나의 활동 내역과 보유 자산을 확인합니다.</p>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
        authDomain: "real8-bc.firebaseapp.com",
        projectId: "real8-bc",
        appId: "1:792768508652:web:14557cae750168f46c6bc9"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function handleAuth(isJoin) {
        const e = document.getElementById('email').value, p = document.getElementById('pw').value;
        if(!e || !p) return alert("정보를 입력하세요.");
        if(isJoin) {
            auth.createUserWithEmailAndPassword(e, p).then(() => alert("가입 성공! 로그인 하세요.")).catch(a => alert(a.message));
        } else {
            auth.signInWithEmailAndPassword(e, p).then(res => {
                document.getElementById('auth-gate').classList.add('hidden');
                document.getElementById('main-system').classList.remove('hidden');
                document.getElementById('user-display').innerText = res.user.email;
            }).catch(() => alert("아이디/비번 확인"));
        }
    }

    function changePage(id, el) {
        document.querySelectorAll('.page-content').forEach(p => p.classList.remove('show'));
        document.getElementById(id).classList.add('show');
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('menu-active'));
        el.classList.add('menu-active');
    }

    function doHash() {
        const raw = document.getElementById('addr').value + window.location.href + new Date().toLocaleString();
        const hash = CryptoJS.SHA256(raw).toString();
        document.getElementById('hash-view').innerHTML = "<b>[블록체인 해시 생성 성공]</b><br>Hash: " + hash;
        alert("공시가 완료되었습니다.");
    }
</script>
</body>
</html>
