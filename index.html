<!DOCTYPE html>
<html lang="ko">
<head>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 자산 디지털 플랫폼 (Real8 - V13)</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* 정린님의 원본 다크 디자인 스타일을 복구했습니다 */
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Pretendard', sans-serif; margin: 0; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-card { background: #1a1a1a; padding: 40px; border-radius: 20px; width: 380px; text-align: center; border: 1px solid #333; }
        input { width: 90%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #262626; color: white; }
        button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-yellow { background: #fee500; color: #3c1e1e; }
        .btn-blue { background: #007bff; color: white; }
        .hidden { display: none !important; }
        
        /* 메인 대시보드 디자인 */
        .header { background: #1a1a1a; padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .container { padding: 30px; }
        .card { background: #1a1a1a; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1 style="color:#fee500;">Real8</h1>
            <p>부동산 자산 관리 플랫폼</p>
            <input type="text" id="login-id" placeholder="이메일 아이디">
            <input type="password" id="login-pw" placeholder="비밀번호 (6자리 이상)">
            
            <button class="btn-yellow" onclick="handleSignUp()">☀️ 신규 회원가입</button>
            <button class="btn-blue" onclick="handleLogin()">로그인 및 입장</button>
            <p style="font-size: 12px; color: #666; margin-top: 20px;">구글 클라우드 보안 서버가 가동 중입니다.</p>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div class="header">
            <div style="font-size: 20px; font-weight: bold; color: #fee500;">Real8 ADMIN</div>
            <div id="user-info">접속 중...</div>
        </div>
        
        <div class="container">
            <div class="card">
                <h2>🏠 매물 등록 및 관리</h2>
                <p>현재 등록된 디지털 자산이 없습니다. 새로운 매물을 등록해 보세요.</p>
                <button style="width: auto; padding: 10px 25px; background: #28a745; color: white; border-radius: 5px;">+ 새 매물 등록</button>
            </div>
            
            <div class="card" style="display: flex; gap: 20px;">
                <div style="flex: 1; background: #262626; padding: 15px; border-radius: 10px;">
                    <h4>나의 포인트</h4>
                    <p style="font-size: 24px; color: #fee500;">1,250,000 P</p>
                </div>
                <div style="flex: 1; background: #262626; padding: 15px; border-radius: 10px;">
                    <h4>등록된 회원</h4>
                    <p style="font-size: 24px; color: #007bff;">운영자 전용</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 사진 64번에서 확인한 정린님 전용 구글 열쇠 정보
        var firebaseConfig = {
            apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
            authDomain: "real8-bc.firebaseapp.com",
            projectId: "real8-bc",
            storageBucket: "real8-bc.firebasestorage.app",
            messagingSenderId: "792768508652",
            appId: "1:792768508652:web:14557cae750168f46c6bc9"
        };
        
        // 구글 서버 시작
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        // [기능 1] 회원가입 처리
        function handleSignUp() {
            const email = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            if(!email || !pw) return alert("아이디와 비밀번호를 입력해주세요.");

            auth.createUserWithEmailAndPassword(email, pw)
                .then(() => alert("가입 성공! 이제 [로그인] 버튼을 눌러주세요."))
                .catch(err => alert("가입 실패: " + err.message));
        }

        // [기능 2] 로그인 및 화면 전환
        function handleLogin() {
            const email = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            
            auth.signInWithEmailAndPassword(email, pw)
                .then((userCredential) => {
                    alert("환영합니다! 정린님의 플랫폼에 접속합니다.");
                    // 로그인 성공 시 로그인창 숨기고 메인화면 보여주기
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    document.getElementById('user-info').innerText = email + "님 접속 중";
                })
                .catch(err => alert("로그인 오류: " + err.message));
        }
    </script>
<script>
  // 1. 구글 서버 열쇠 (정린님 전용)
  var firebaseConfig = {
    apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
    authDomain: "real8-bc.firebaseapp.com",
    projectId: "real8-bc",
    appId: "1:792768508652:web:14557cae750168f46c6bc9"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // 2. 신규 가입 버튼 기능
  function signUp(email, password) {
    if(!email || !password) return alert("아이디와 비밀번호를 입력해주세요.");
    auth.createUserWithEmailAndPassword(email, password)
      .then(() => alert("축하합니다! 구글 서버 가입 성공! 이제 로그인 버튼을 누르세요."))
      .catch((error) => alert("가입 실패: " + error.message));
  }

  // 3. 로그인 및 메인 화면 전환 기능
  function login(email, password) {
    auth.signInWithEmailAndPassword(email, password)
      .then(() => {
        alert("로그인 성공! 환영합니다.");
        // 로그인창을 숨기고 정린님의 화려한 부동산 화면(main-app)을 보여줍니다.
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-app').classList.remove('hidden');
      })
      .catch((error) => alert("로그인 오류: " + error.message));
  }
</script>
</body>
</html>
