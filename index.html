<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 - 포털 회원가입 및 로그인</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        body { background-color: #f5f6f7; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-card { width: 400px; background: #fff; padding: 40px; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .logo { font-size: 32px; font-weight: bold; color: #03c75a; text-align: center; margin-bottom: 30px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .btn-submit { width: 100%; padding: 15px; background: #03c75a; color: white; border: none; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .toggle-text { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .toggle-text span { color: #03c75a; cursor: pointer; font-weight: bold; text-decoration: underline; }
        .hidden { display: none !important; }
        
        /* 로그인 성공 후 화면 */
        #main-app { background: #0d0d0d; color: #fff; width: 100%; height: 100vh; display: flex; flex-direction: column; }
        .nav { background: #1a1a1a; padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div id="auth-page" class="auth-card">
    <div class="logo">Real8</div>
    
    <div id="form-area">
        <h3 id="form-title" style="text-align: center; margin-bottom: 20px;">로그인</h3>
        <input type="email" id="email" placeholder="이메일 주소 (아이디)">
        <input type="password" id="pw" placeholder="비밀번호">
        <button class="btn-submit" id="submit-btn" onclick="handleSubmit()">로그인하기</button>
        
        <div class="toggle-text" id="toggle-msg">
            아직 회원이 아니신가요? <span onclick="switchMode(true)">회원가입 하기</span>
        </div>
    </div>
</div>

<div id="main-app" class="hidden">
    <div class="nav">
        <span style="color:#fee500; font-weight:bold; font-size:20px;">Real8 시스템 접속 성공</span>
        <span><b id="user-display" style="color:#03c75a;"></b>님 환영합니다 | <button onclick="location.reload()">로그아웃</button></span>
    </div>
    <div style="padding: 40px; text-align: center;">
        <h2>본인 확인이 완료되어 시스템에 접속되었습니다.</h2>
        <p>이제 일반인 다수가 가입하고 이용하는 포털 체계가 작동합니다.</p>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
        authDomain: "real8-bc.firebaseapp.com",
        projectId: "real8-bc",
        appId: "1:792768508652:web:14557cae750168f46c6bc9"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let isSignUp = false;

    // 회원가입 <-> 로그인 모드 전환
    function switchMode(signUp) {
        isSignUp = signUp;
        document.getElementById('form-title').innerText = isSignUp ? "신규 회원가입" : "로그인";
        document.getElementById('submit-btn').innerText = isSignUp ? "본인 확인 및 가입" : "로그인하기";
        document.getElementById('toggle-msg').innerHTML = isSignUp ? 
            "이미 계정이 있으신가요? <span onclick='switchMode(false)'>로그인하기</span>" : 
            "아직 회원이 아니신가요? <span onclick='switchMode(true)'>회원가입 하기</span>";
    }

    // 본인 확인 절차 실행
    function handleSubmit() {
        const email = document.getElementById('email').value;
        const pw = document.getElementById('pw').value;

        if(!email || !pw) return alert("정보를 입력해 주세요.");

        if(isSignUp) {
            // [회원가입] 본인 확인 및 계정 생성
            auth.createUserWithEmailAndPassword(email, pw)
                .then(() => {
                    alert("본인 확인 및 회원가입이 완료되었습니다! 로그인해 주세요.");
                    switchMode(false);
                })
                .catch(err => alert("가입 오류: " + err.message));
        } else {
            // [로그인] 본인 확인 후 입장
            auth.signInWithEmailAndPassword(email, pw)
                .then((res) => {
                    document.getElementById('auth-page').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    document.getElementById('user-display').innerText = res.user.email;
                })
                .catch(err => alert("로그인 실패: 정보를 확인하세요."));
        }
    }
</script>
</body>
</html>
