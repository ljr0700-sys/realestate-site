<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 Platform - 본인확인 및 자산관리</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 1. 로그인 대문 (네이버 스타일) */
        body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: #f5f6f7; }
        .gate-way { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; padding: 50px; border: 1px solid #ddd; border-radius: 12px; width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .logo { font-size: 38px; font-weight: bold; color: #03c75a; margin-bottom: 30px; }
        .in-field { width: 100%; padding: 15px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn-green { width: 100%; padding: 16px; background: #03c75a; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 18px; }
        .hidden { display: none !important; }

        /* 2. 사진 113번 정린님 원본 디자인 (절대 불변) */
        #real-program { background: #000; color: #fff; min-height: 100vh; }
        .blue-head { background: #2b579a; padding: 18px 25px; display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; }
        .yellow-nav { background: #1a1a1a; display: flex; border-bottom: 1px solid #333; }
        .nav-tab { padding: 15px 25px; font-size: 14px; cursor: pointer; border-right: 1px solid #222; }
        .nav-on { background: #fee500; color: #000; font-weight: bold; }
        .panel { padding: 40px; max-width: 950px; }
        .box { border: 1px solid #fee500; padding: 30px; border-radius: 8px; background: #0a0a0a; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-top: 25px; }
        .fld label { display: block; font-size: 14px; color: #fee500; margin-bottom: 10px; }
        .fld input { width: 100%; background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 12px; font-size: 16px; }
        .btn-pub { background: #007bff; color: white; border: none; padding: 20px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 30px; }
        #hash-display { margin-top: 25px; padding: 20px; background: #111; border: 1px dashed #555; color: #00ff00; font-family: monospace; word-break: break-all; }
    </style>
</head>
<body>

<div id="auth-gate" class="gate-way">
    <div class="login-box">
        <div class="logo">Real8</div>
        <input type="email" id="email-val" class="in-field" placeholder="이메일 주소">
        <input type="password" id="pw-val" class="in-field" placeholder="비밀번호">
        <button class="btn-green" onclick="doLogin()">로그인</button>
        <button class="btn-green" style="background:#fff; color:#666; border:1px solid #ccc; margin-top:8px;" onclick="doJoin()">회원가입</button>
    </div>
</div>

<div id="real-program" class="hidden">
    <div class="blue-head">
        <span>Real8 Platform (Server)</span>
        <div style="font-size:13px; font-weight:normal;"><span id="user-tag" style="color:#fee500;"></span>님 | <button onclick="location.reload()" style="background:none; border:none; color:#fff; cursor:pointer;">로그아웃</button></div>
    </div>
    <div class="yellow-nav">
        <div class="nav-tab">홈·안내</div>
        <div class="nav-tab nav-on">블록체인·토큰코인</div>
        <div class="nav-tab">건축·매매·임대·펜션</div>
        <div class="nav-tab">가상건축</div>
        <div class="nav-tab">주거문화</div>
    </div>

    <div class="panel">
        <div class="box">
            <h2 style="margin:0;">토큰/코인 발행 기준 및 관리</h2>
            <div style="margin-top:25px; padding:20px; background:#1a1a1a; border-radius:6px;">
                <label style="color:#aaa; font-size:12px;">📍 부동산 주소</label>
                <input type="text" id="p-addr" value="경기도 가평군 설악면" style="width:100%; background:transparent; border:none; color:#fff; font-size:18px; border-bottom:1px solid #444;">
            </div>
            <div class="grid">
                <div class="fld"><label>1. 부동산 정보 등록 시 지급량</label><input type="text" id="i1" value="500"></div>
                <div class="fld"><label>4. 주거문화 글쓰기 지급량</label><input type="text" id="i4" value="50"></div>
                <div class="fld"><label>2. 가상건축 제안 지급량</label><input type="text" id="i2" value="100"></div>
                <div class="fld"><label>5. 주거문화 댓글 지급량</label><input type="text" id="i5" value="20"></div>
                <div class="fld"><label>3. 가상건축 참여 지급량</label><input type="text" id="i3" value="20"></div>
                <div class="fld"><label style="color:#ff4d4d;">🔴 환전율</label><input type="text" id="iex" value="100"></div>
            </div>
            <button class="btn-pub" onclick="runHashLogic()">설정 저장 및 블록체인 해시 공시</button>
            <div id="hash-display">※ 해시 생성 대기 중...</div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
        authDomain: "real8-bc.firebaseapp.com",
        projectId: "real8-bc",
        appId: "1:792768508652:web:14557cae750168f46c6bc9"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function doJoin() {
        const e = document.getElementById('email-val').value, p = document.getElementById('pw-val').value;
        auth.createUserWithEmailAndPassword(e, p).then(() => alert("본인 확인 완료!")).catch(err => alert(err.message));
    }

    function doLogin() {
        const e = document.getElementById('email-val').value, p = document.getElementById('pw-val').value;
        auth.signInWithEmailAndPassword(e, p).then(res => {
            document.getElementById('auth-gate').classList.add('hidden');
            document.getElementById('real-program').classList.remove('hidden');
            document.getElementById('user-tag').innerText = res.user.email;
        }).catch(() => alert("정보 확인 실패"));
    }

    // [건드리지 않은 정린님만의 해시 로직]
    function runHashLogic() {
        const addr = document.getElementById('p-addr').value; // 주소
        const site = window.location.href; // 사이트
        const time = new Date().toLocaleString(); // 시간
        
        // 정린님이 말씀하신 3가지 연계
        const raw = addr + "|" + site + "|" + time;
        const hash = CryptoJS.SHA256(raw).toString();
        
        document.getElementById('hash-display').innerHTML = `
            <b>[블록체인 해시 공시 결과]</b><br>
            • 주소: ${addr}<br>• 사이트: ${site}<br>• 일시: ${time}<br>
            • 해시값: ${hash}
        `;
        alert("정린님, 기존 로직대로 해시값이 생성되었습니다.");
    }
</script>
</body>
</html>
