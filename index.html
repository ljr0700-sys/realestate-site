<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 자산 디지털 플랫폼 (Real8 - V13 Admin)</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        /* 정린님의 원본 디자인 CSS (그대로 유지) */
        :root { --bg: #121212; --card: #1e1e1e; --blue: #0056b3; --text: #e0e0e0; --input-bg: #2c2c2c; }
        body { font-family: 'Noto Sans KR', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        header { background: var(--blue); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #003d80; }
        .logo { font-size: 22px; font-weight: bold; color: white; }
        nav { background: #000; border-bottom: 1px solid #333; }
        .nav-box { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; }
        .nav-btn { padding: 15px 20px; color: #888; cursor: pointer; font-size: 14px; border-right: 1px solid #222; transition: 0.3s; }
        .nav-btn:hover { color: white; background: #222; }
        .nav-btn.active { background: #FEE500; color: black; font-weight: bold; }
        .container { max-width: 1200px; margin: 30px auto; padding: 20px; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: var(--card); padding: 25px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .head-title { border-left: 5px solid var(--blue); padding-left: 15px; font-size: 20px; font-weight: bold; color: white; margin-bottom: 20px; }
        label { display: block; color: #aaa; margin: 12px 0 5px; font-size: 13px; }
        input, select, textarea { width: 96%; padding: 12px; background: var(--input-bg); border: 1px solid #444; color: white; border-radius: 4px; font-size: 14px; }
        button { width: 100%; padding: 14px; background: #0d6efd; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 15px; }
        .btn-yellow { background: #FEE500; color: black; }
        .hidden { display: none !important; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 5000; display: flex; justify-content: center; align-items: center; }
        .login-card { background: #1e1e1e; padding: 40px; border-radius: 10px; width: 400px; text-align: center; border: 1px solid #333; }
        .split-layout { display: flex; gap: 30px; }
        .left-form { flex: 1; }
        .right-list { flex: 1.5; background: #252525; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .radio-group { display: flex; gap: 10px; }
        .radio-label { flex: 1; background: #333; padding: 10px; text-align: center; border-radius: 4px; cursor: pointer; border: 1px solid #444; }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .radio-label { background: var(--blue); color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #333; padding: 10px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #444; }
        .hash-box { background: #111; color: #28a745; padding: 8px; font-size: 11px; word-break: break-all; }
        .progress-bar-bg { width: 100%; background: #444; height: 12px; border-radius: 6px; }
        .progress-bar-fill { height: 100%; background: #0d6efd; width: 0%; transition: 0.5s; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2 style="color:white; margin-bottom:20px;">Real8 로그인</h2>
            <p style="color:#888; font-size:13px; margin-bottom:30px;">구글 서버와 연동된 안전한 플랫폼입니다.</p>
            
            <input type="text" id="login-id" placeholder="이메일 주소 입력">
            <input type="password" id="login-pw" placeholder="비밀번호 (6자리 이상)">
            
            <button class="btn-yellow" onclick="handleSignUp()">🌟 신규 회원가입</button>
            <button onclick="handleLogin()">로그인</button>
            
            <p onclick="app.emergencyReset()" style="margin-top:20px; font-size:12px; color:#555; cursor:pointer;">⚠️ 화면 초기화</p>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <header>
            <div class="logo">부동산 자산 디지털 플랫폼 (Real8)</div>
            <div style="font-size:13px; color:white;">
                <span id="user-name" style="color:#FEE500; font-weight:bold;">User</span>님 환영합니다
                <a onclick="location.reload()" style="color:#aaa; margin-left:15px; cursor:pointer;">로그아웃</a>
            </div>
        </header>

        <nav>
            <div class="nav-box">
                <div onclick="app.go('home')" class="nav-btn active" id="nav-home">홈·안내</div>
                <div onclick="app.go('blockchain')" class="nav-btn" id="nav-blockchain">블록체인·토큰코인</div>
                <div onclick="app.go('info')" class="nav-btn" id="nav-info">건축·매매·임대 (등록)</div>
                <div onclick="app.go('virt')" class="nav-btn" id="nav-virt">가상건축 프로젝트</div>
                <div onclick="app.go('my')" class="nav-btn" id="nav-my">마이페이지</div>
            </div>
        </nav>

        <div class="container">
            <div id="page-home" class="page active">
                <div class="card">
                    <div class="head-title">사이트 이용 안내</div>
                    <ul style="line-height:2.0; color:#ccc;">
                        <li>✅ <strong>정보등록:</strong> 실제 부동산 정보를 등록하고 토큰을 보상받으세요.</li>
                        <li>✅ <strong>블록체인:</strong> 모든 거래 내역은 해시값으로 증명됩니다.</li>
                    </ul>
                </div>
            </div>

            <div id="page-info" class="page">
                <div class="card">
                    <div class="head-title">부동산 정보 등록</div>
                    <div class="split-layout">
                        <div class="left-form">
                            <label>거래 종류</label>
                            <select id="reg-type" onchange="app.updateRoleLabels()">
                                <option value="건축">건축</option><option value="매매">매매</option><option value="임대">임대</option>
                            </select>
                            <label>나의 역할</label>
                            <div class="radio-group">
                                <label style="flex:1;"><input type="radio" name="my-role" value="gap" checked><div class="radio-label">갑</div></label>
                                <label style="flex:1;"><input type="radio" name="my-role" value="eul"><div class="radio-label">을</div></label>
                            </div>
                            <label>금액 (원)</label><input type="number" id="reg-price">
                            <label>주소</label><input type="text" id="reg-addr">
                            <button onclick="app.submitInfo()">정보 등록하기</button>
                        </div>
                        <div class="right-list">
                            <table><thead><tr><th>분류</th><th>주소</th><th>상태</th></tr></thead><tbody id="info-table-body"></tbody></table>
                        </div>
                    </div>
                </div>
            </div>
            </div>
    </div>

    <script>
        // [1] 구글 서버 설정 (정린님 전용 열쇠)
        var firebaseConfig = {
            apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
            authDomain: "real8-bc.firebaseapp.com",
            projectId: "real8-bc",
            appId: "1:792768508652:web:14557cae750168f46c6bc9"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // [2] 구글 회원가입 기능
        function handleSignUp() {
            const email = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            auth.createUserWithEmailAndPassword(email, pw)
                .then(() => alert("가입 성공! 이제 로그인 버튼을 눌러주세요."))
                .catch(err => alert("오류: " + err.message));
        }

        // [3] 구글 로그인 & 화면 전환 기능
        function handleLogin() {
            const email = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            auth.signInWithEmailAndPassword(email, pw)
                .then(() => {
                    alert("로그인 성공!");
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('main-app').classList.remove('hidden');
                    document.getElementById('user-name').innerText = email.split('@')[0];
                })
                .catch(err => alert("실패: " + err.message));
        }

        // [4] 정린님의 기존 앱 로직 (원본 유지)
        const KEY = "REAL8_V13_ADMIN_";
        const app = {
            data: { config: { rate: 100, reward_info: 500 }, users: {}, ledger: [], posts: [], info: [] },
            init: function() {
                const loaded = localStorage.getItem(KEY + 'data');
                if (loaded) this.data = JSON.parse(loaded);
                this.render();
            },
            save: function() { localStorage.setItem(KEY + 'data', JSON.stringify(this.data)); this.render(); },
            go: function(id) {
                document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
                document.getElementById('page-'+id).classList.add('active');
                document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
                document.getElementById('nav-'+id).classList.add('active');
            },
            submitInfo: function() {
                const addr = document.getElementById('reg-addr').value;
                const price = document.getElementById('reg-price').value;
                if(!addr || !price) return alert("입력 확인");
                this.data.info.push({ id: Date.now(), addr, price, status: '진행중', type: document.getElementById('reg-type').value });
                alert("등록 완료!"); this.save();
            },
            render: function() {
                document.getElementById('info-table-body').innerHTML = this.data.info.map(i=>`<tr><td>${i.type}</td><td>${i.addr}</td><td>${i.status}</td></tr>`).join('');
            },
            emergencyReset: function() { localStorage.clear(); location.reload(); }
        };
        app.init();
    </script>
</body>
</html>
