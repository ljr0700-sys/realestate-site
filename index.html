<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 Platform - 통합 자산 포털</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: #000; color: #fff; }
        .hidden { display: none !important; }
        
        /* [대문] 네이버 스타일 로그인 */
        #auth-gate { background: #f5f6f7; height: 100vh; display: flex; align-items: center; justify-content: center; position: fixed; width: 100%; z-index: 9999; }
        .login-box { background: #fff; padding: 45px; border: 1px solid #ddd; border-radius: 12px; width: 360px; text-align: center; }
        .login-box input { width: 100%; padding: 13px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; color: #000; }
        .btn-green { width: 100%; padding: 15px; background: #03c75a; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* [본체] 사진 22장 분량의 모든 화면 복구 */
        .header-blue { background: #2b579a; padding: 18px 25px; display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; }
        .menu-bar { background: #1a1a1a; display: flex; border-bottom: 1px solid #333; }
        .menu-item { padding: 15px 25px; font-size: 14px; color: #fff; cursor: pointer; border-right: 1px solid #222; }
        .active-menu { background: #fee500; color: #000; font-weight: bold; }
        
        .page-content { padding: 40px; max-width: 1000px; display: none; }
        .active-page { display: block !important; }
        
        .card { border: 1px solid #fee500; padding: 25px; border-radius: 5px; background: #0a0a0a; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .fld label { display: block; font-size: 13px; color: #fee500; margin-bottom: 8px; }
        .fld input, .fld select, .fld textarea { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 12px; box-sizing: border-box; }
        .btn-action { background: #007bff; color: white; border: none; padding: 18px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="login-box">
        <h1 style="color:#03c75a;">Real8</h1>
        <input type="email" id="email" placeholder="이메일 주소">
        <input type="password" id="pw" placeholder="비밀번호">
        <button class="btn-green" onclick="handleAuth(false)">로그인하기</button>
        <button class="btn-green" style="background:#ffc107; color:#000; margin-top:5px;" onclick="handleAuth(true)">신규 회원가입</button>
    </div>
</div>

<div id="main-app" class="hidden">
    <div class="header-blue">
        <span>Real8 Platform (Server)</span>
        <div style="font-size:13px; font-weight:normal;"><span id="user-display" style="color:#fee500;"></span>님 | <button onclick="location.reload()" style="color:#fff; background:none; border:none; cursor:pointer;">로그아웃</button></div>
    </div>
    
    <div class="menu-bar">
        <div class="menu-item" onclick="goPage('p-home', this)">홈·안내</div>
        <div class="menu-item active-menu" onclick="goPage('p-bc', this)">블록체인·토큰코인</div>
        <div class="menu-item" onclick="goPage('p-build', this)">건축·매매·임대·펜션</div>
        <div class="menu-item" onclick="goPage('p-virt', this)">가상건축</div>
        <div class="menu-item" onclick="goPage('p-cult', this)">주거문화</div>
        <div class="menu-item" onclick="goPage('p-my', this)">마이페이지</div>
    </div>

    <div id="p-home" class="page-content">
        <div class="card"><h3>Real8 이용 안내</h3><p>로그인 후 모든 정보 등록 및 블록체인 공시가 가능합니다.</p></div>
    </div>

    <div id="p-bc" class="page-content active-page">
        <div class="card">
            <h2>블록체인 해시 공시 설정</h2>
            <div class="fld"><label>📍 부동산 주소</label><input type="text" id="prop-addr" value="경기도 가평군 설악면"></div>
            <div class="grid">
                <div class="fld"><label>등록 지급량</label><input type="text" id="v1" value="500"></div>
                <div class="fld"><label>환전율</label><input type="text" id="vex" value="100"></div>
            </div>
            <button class="btn-action" onclick="makeHash()">데이터 공시 및 해시 생성</button>
            <div id="hash-log" style="margin-top:20px; color:#00ff00; font-family:monospace; word-break:break-all; background:#111; padding:15px; border:1px dashed #555;"></div>
        </div>
    </div>

    <div id="p-build" class="page-content">
        <div class="card">
            <h2>부동산 정보 등록</h2>
            <div class="fld"><label>1. 거래 종류</label><select><option>건축</option><option>매매</option><option>임대</option></select></div>
            <div class="fld" style="margin-top:15px;"><label>4. 주소</label><input type="text" placeholder="정확한 주소 입력"></div>
            <button class="btn-action" style="background:#28a745;">정보 등록하기</button>
        </div>
    </div>

    <div id="p-virt" class="page-content">
        <div class="card">
            <h2>가상건축 프로젝트 제안</h2>
            <div class="fld"><label>제목</label><input type="text" placeholder="제안 제목"></div>
            <div class="fld" style="margin-top:15px;"><label>내용</label><textarea style="height:100px;"></textarea></div>
            <button class="btn-action">프로젝트 제출</button>
        </div>
    </div>

    <div id="p-cult" class="page-content">
        <div class="card">
            <h2>주거문화 정보 공유</h2>
            <div class="fld"><label>내용 공유</label><textarea style="height:200px;" placeholder="소중한 경험을 들려주세요."></textarea></div>
            <button class="btn-action">글 등록하기</button>
        </div>
    </div>

    <div id="p-my" class="page-content">
        <div class="card"><h2>마이페이지</h2><p>나의 활동 및 보유 자산 내역입니다.</p></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
        authDomain: "real8-bc.firebaseapp.com",
        projectId: "real8-bc",
        appId: "1:792768508652:web:14557cae750168f46c6bc9"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function handleAuth(isJoin) {
        const e = document.getElementById('email').value, p = document.getElementById('pw').value;
        if(isJoin) {
            auth.createUserWithEmailAndPassword(e, p).then(() => alert("가입 성공! 로그인하세요.")).catch(a => alert(a.message));
        } else {
            auth.signInWithEmailAndPassword(e, p).then(res => {
                document.getElementById('auth-gate').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-display').innerText = res.user.email;
            }).catch(() => alert("정보 확인 필요"));
        }
    }

    function goPage(id, el) {
        document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active-page'));
        document.getElementById(id).classList.add('active-page');
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active-menu'));
        el.classList.add('active-menu');
    }

    function makeHash() {
        const addr = document.getElementById('prop-addr').value;
        const raw = addr + window.location.href + new Date().toLocaleString();
        const hash = CryptoJS.SHA256(raw).toString();
        document.getElementById('hash-log').innerHTML = "<b>[공시 완료]</b><br>주소: " + addr + "<br>해시: " + hash;
        alert("성공적으로 공시되었습니다.");
    }
</script>
</body>
</html>
