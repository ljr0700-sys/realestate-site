<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 Platform - 통합 자산 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 사진 속 다크모드 디자인 완벽 복구 */
        body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: #000; color: #fff; }
        .hidden { display: none !important; }
        
        /* [문] 로그인 대문 */
        #auth-gate { background: #f5f6f7; height: 100vh; display: flex; align-items: center; justify-content: center; position: fixed; width: 100%; z-index: 9999; }
        .login-box { background: #fff; padding: 45px; border-radius: 12px; width: 360px; text-align: center; color: #333; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .logo-txt { font-size: 38px; font-weight: bold; color: #03c75a; margin-bottom: 25px; }

        /* [본체] 사진 속 모든 메뉴와 양식 재현 */
        .header-blue { background: #2b579a; padding: 18px 25px; display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; border-bottom: 3px solid #003d80; }
        .nav-bar { background: #1a1a1a; display: flex; border-bottom: 1px solid #333; }
        .nav-item { padding: 15px 25px; font-size: 14px; color: #fff; cursor: pointer; border-right: 1px solid #222; }
        .nav-active { background: #fee500; color: #000; font-weight: bold; }
        
        .container { padding: 40px; max-width: 1100px; display: none; }
        .active-view { display: block !important; }
        
        .card { border: 1px solid #fee500; padding: 30px; border-radius: 8px; background: #0a0a0a; margin-bottom: 25px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; }
        label { display: block; font-size: 13px; color: #fee500; margin-bottom: 8px; }
        input, select, textarea { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 13px; box-sizing: border-box; border-radius: 4px; }
        .btn-blue { background: #007bff; color: white; border: none; padding: 18px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 25px; font-size: 17px; }
        #hash-log { margin-top: 25px; padding: 15px; background: #111; border: 1px dashed #555; color: #00ff00; font-family: monospace; font-size: 13px; word-break: break-all; }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="login-box">
        <div class="logo-txt">Real8</div>
        <p style="color:#888; margin-top:-15px; margin-bottom:25px;">포털 이용을 위해 로그인해 주세요</p>
        <input type="email" id="u-email" placeholder="이메일 주소" style="margin-bottom:10px;">
        <input type="password" id="u-pw" placeholder="비밀번호" style="margin-bottom:15px;">
        <button onclick="handleAuth(false)" style="width:100%; padding:15px; background:#03c75a; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">로그인</button>
        <button onclick="handleAuth(true)" style="width:100%; padding:12px; background:#fff; color:#666; border:1px solid #ccc; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:10px;">회원가입</button>
    </div>
</div>

<div id="main-sys" class="hidden">
    <div class="header-blue">
        <span>Real8 Platform (Server)</span>
        <div style="font-size:13px;"><span id="u-name" style="color:#fee500;"></span>님 접속 | <button onclick="location.reload()" style="background:none; border:none; color:#fff; cursor:pointer; text-decoration:underline;">로그아웃</button></div>
    </div>
    
    <div class="nav-bar">
        <div class="nav-item" onclick="showPage('home', this)">홈·안내</div>
        <div class="nav-item nav-active" onclick="showPage('bc', this)">블록체인·토큰코인</div>
        <div class="nav-item" onclick="showPage('build', this)">건축·매매·임대·펜션</div>
        <div class="nav-item" onclick="showPage('virt', this)">가상건축</div>
        <div class="nav-item" onclick="showPage('cult', this)">주거문화</div>
        <div class="nav-item" onclick="showPage('my', this)">마이페이지</div>
    </div>

    <div id="home" class="container">
        <div class="card"><h3>Real8 이용 안내 (서버 연동)</h3><p style="color:#ccc; line-height:2;">모든 정보는 구글 서버에 저장되며, 블록체인 해시를 통해 투명하게 공시됩니다.</p></div>
    </div>

    <div id="bc" class="container active-view">
        <div class="card">
            <h2 style="margin-top:0;">토큰/코인 발행 기준 및 관리</h2>
            <div style="margin-top:20px; padding:20px; background:#1a1a1a; border-radius:6px;">
                <label>📍 해시 연계용 부동산 주소 (재료 1)</label>
                <input type="text" id="p-addr" value="경기도 가평군 설악면" style="font-size:18px; border:none; border-bottom:1px solid #444;">
            </div>
            <div class="grid-2">
                <div><label>등록 시 지급량</label><input type="text" id="v1" value="500"></div>
                <div><label>환전율 (토큰->코인)</label><input type="text" id="vex" value="100"></div>
            </div>
            <button class="btn-blue" onclick="makeOfficialHash()">설정 저장 및 블록체인 해시 공시</button>
            <div id="hash-log">※ 공시 전: [주소+사이트+시간] 연계 데이터 대기 중...</div>
        </div>
    </div>

    <div id="build" class="container">
        <div class="card">
            <h3>부동산 정보 등록</h3>
            <label>1. 거래 종류</label><select><option>건축</option><option>매매</option><option>임대</option></select>
            <label style="margin-top:20px;">4. 주소 (중복불가)</label><input type="text" placeholder="매물 주소를 입력해 주세요.">
            <button class="btn-blue" style="background:#28a745;">정보 등록</button>
        </div>
    </div>

    <div id="virt" class="container">
        <div class="card">
            <h3>가상건축 프로젝트 제안</h3>
            <input type="text" placeholder="제안 제목" style="margin-bottom:15px;">
            <textarea style="height:150px;" placeholder="프로젝트 상세 내용을 입력하세요."></textarea>
            <button class="btn-blue">제안 제출</button>
        </div>
    </div>

    <div id="culture" class="container">
        <div class="card">
            <h3>주거문화 정보 공유</h3>
            <textarea style="height:200px;" placeholder="나만의 소중한 주거 문화를 공유해 주세요."></textarea>
            <button class="btn-blue">글 등록하기</button>
        </div>
    </div>

    <div id="my" class="container">
        <div class="card"><h3>마이페이지</h3><p>나의 토큰 및 코인 보유 현황입니다.</p></div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8", authDomain: "real8-bc.firebaseapp.com", projectId: "real8-bc", appId: "1:792768508652:web:14557cae750168f46c6bc9" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function handleAuth(isJoin) {
        const e = document.getElementById('u-email').value, p = document.getElementById('u-pw').value;
        if(isJoin) {
            auth.createUserWithEmailAndPassword(e, p).then(() => alert("가입 완료! 로그인하세요.")).catch(a => alert(a.message));
        } else {
            auth.signInWithEmailAndPassword(e, p).then(r => {
                document.getElementById('auth-gate').classList.add('hidden');
                document.getElementById('main-sys').classList.remove('hidden');
                document.getElementById('u-name').innerText = r.user.email;
            }).catch(() => alert("정보 확인 실패"));
        }
    }

    function showPage(id, el) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active-view'));
        document.getElementById(id).classList.add('active-view');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('nav-active'));
        el.classList.add('nav-active');
    }

    // [정린님 핵심 요청] 3대 데이터 연계 해시 생성
    function makeOfficialHash() {
        const addr = document.getElementById('p-addr').value;
        const site = window.location.href;
        const time = new Date().toLocaleString();
        const hash = CryptoJS.SHA256(addr + "|" + site + "|" + time).toString();
        
        document.getElementById('hash-log').innerHTML = `<b>[블록체인 증명 성공]</b><br>• 주소: ${addr}<br>• 사이트: ${site}<br>• 해시값: ${hash}`;
        alert("해시 공시가 완료되었습니다.");
    }
</script>
</body>
</html>
