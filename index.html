<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 - 통합 자산 관리 포털</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #f5f6f7; font-family: sans-serif; margin: 0; }
        .hidden { display: none !important; }
        /* 로그인 창 디자인 */
        .auth-wrap { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-box { width: 360px; padding: 40px; background: #fff; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .btn-green { width: 100%; padding: 15px; background: #03c75a; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        /* 본 화면(다크 모드) 디자인 */
        #main-app { background-color: #0d0d0d; color: #fff; min-height: 100vh; }
        .nav { background: #1a1a1a; padding: 15px 25px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 25px; margin: 20px; }
    </style>
</head>
<body>

<div id="auth-page" class="auth-wrap">
    <div class="auth-box">
        <h1 style="color:#03c75a;">Real8</h1>
        <input type="email" id="email" placeholder="이메일(아이디)">
        <input type="password" id="pw" placeholder="비밀번호">
        <button class="btn-green" onclick="handleAuth(false)">로그인</button>
        <button class="btn-green" style="background:#ffc107; color:#000; margin-top:5px;" onclick="handleAuth(true)">회원가입</button>
    </div>
</div>

<div id="main-app" class="hidden">
    <div class="nav">
        <div style="font-size:20px; font-weight:bold; color:#fee500;">Real8 Platform</div>
        <div style="font-size:14px;"><span id="user-info" style="color:#fee500;"></span>님 접속 중 | <button onclick="location.reload()">로그아웃</button></div>
    </div>
    <div class="card">
        <h3 style="border-left: 4px solid #fee500; padding-left: 10px;">토큰/코인 발행 기준 및 관리 (사진 106번 복구)</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top:20px;">
            <div>
                <label style="font-size:12px; color:#888;">부동산 등록 지급량</label>
                <input type="text" id="val1" value="500" style="background:#222; color:#fff; border:1px solid #444; width:100%;">
            </div>
            <div>
                <label style="font-size:12px; color:#888;">배당 수익률 (%)</label>
                <input type="text" id="val2" value="3.5" style="background:#222; color:#fff; border:1px solid #444; width:100%;">
            </div>
        </div>
        <button onclick="saveData()" style="margin-top:20px; background:#007bff; color:#fff; border:none; padding:12px; border-radius:5px; width:100%;">서버에 설정값 저장</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
        authDomain: "real8-bc.firebaseapp.com",
        projectId: "real8-bc",
        databaseURL: "https://real8-bc-default-rtdb.firebaseio.com",
        appId: "1:792768508652:web:14557cae750168f46c6bc9"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function handleAuth(isSignUp) {
        const e = document.getElementById('email').value;
        const p = document.getElementById('pw').value;
        if(isSignUp) {
            auth.createUserWithEmailAndPassword(e, p).then(() => alert("가입 성공! 로그인 하세요.")).catch(err => alert(err.message));
        } else {
            auth.signInWithEmailAndPassword(e, p).then((res) => {
                document.getElementById('auth-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-info').innerText = res.user.email;
            }).catch(() => alert("인증 실패"));
        }
    }

    function saveData() {
        db.ref('settings').set({
            v1: document.getElementById('val1').value,
            v2: document.getElementById('val2').value
        }).then(() => alert("구글 서버 저장 완료!"));
    }
</script>
</body>
</html>
