<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 v2026 - 정린님 원본 100% 즉시개방</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Malgun Gothic', sans-serif; }
        header { background: #2b579a; padding: 18px 25px; display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; border-bottom: 3px solid #003d80; }
        nav { background: #1a1a1a; display: flex; border-bottom: 2px solid #333; }
        .nav-btn { padding: 15px 25px; cursor: pointer; color: #fff; border-right: 1px solid #222; font-size: 14px; }
        .nav-active { background: #fee500 !important; color: #000 !important; font-weight: bold; }
        .page { padding: 40px; display: none; max-width: 1000px; margin: 0 auto; }
        .show { display: block !important; }
        .card { border: 1px solid #fee500; padding: 30px; background: #0a0a0a; border-radius: 8px; margin-bottom: 25px; }
        label { display: block; font-size: 13px; color: #fee500; margin-top: 18px; }
        input, select, textarea { width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; margin-top: 8px; }
        .btn-action { background: #007bff; color: white; border: none; padding: 18px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 25px; }
        #auth-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f5f6f7; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-box { background: #fff; padding: 45px; border-radius: 12px; width: 380px; text-align: center; color: #333; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="login-box">
        <h1 style="color:#03c75a; font-size:42px; margin-bottom:10px;">Real8</h1>
        <p style="color:#666; margin-bottom:30px;">아이디와 비밀번호를 입력하고 입장하세요.</p>
        <input type="email" id="email" placeholder="이메일 주소" style="color:#000; background:#fff; border:1px solid #ccc;">
        <input type="password" id="pw" placeholder="비밀번호" style="color:#000; background:#fff; border:1px solid #ccc; margin-top:10px;">
        <button onclick="handleLogin()" style="width:100%; padding:15px; background:#03c75a; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:15px;">본인 확인 후 바로 입장</button>
        <button onclick="handleJoin()" style="width:100%; padding:15px; background:#ffc107; color:#000; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:10px;">신규 회원가입 신청</button>
    </div>
</div>

<div id="main-app" style="display:none;">
    <header><span>Real8 Platform</span><div style="font-size:13px;"><span id="u-tag" style="color:#fee500;"></span>님 접속 | <a onclick="location.reload()" style="color:#fff; cursor:pointer;">로그아웃</a></div></header>
    <nav>
        <div class="nav-btn nav-active" onclick="goPage('p1', this)">블록체인·토큰코인</div>
        <div class="nav-btn" onclick="goPage('p2', this)">건축·매매·임대·펜션</div>
        <div class="nav-btn" onclick="goPage('p3', this)">가상건축</div>
        <div class="nav-btn" onclick="goPage('p4', this)">마이페이지</div>
    </nav>

    <div id="p1" class="page show"><div class="card"><h2>토큰/코인 발행 기준 설정</h2><label>1. 부동산 정보 등록 지급량</label><input type="text" value="500"><label>📍 해시 공시용 주소</label><input type="text" id="p-addr" value="경기도 가평군 설악면"><button class="btn-action" onclick="makeHash()">저장 및 해시 공시</button><div id="hash-log" style="margin-top:20px; color:#00ff00; word-break:break-all;"></div></div></div>
    <div id="p2" class="page"><div class="card"><h2>부동산 정보 등록</h2><label>1. 거래 종류</label><select><option>건축</option><option>매매</option></select><label>2. 나의 역할</label><div style="margin-top:8px;"><input type="radio" name="r"> 갑 <input type="radio" name="r" style="margin-left:20px;"> 을</div><button class="btn-action" style="background:#28a745;">정보 등록하기</button></div></div>
    <div id="p3" class="page"><div class="card"><h2>가상건축</h2><textarea style="height:200px;"></textarea><button class="btn-action">제출</button></div></div>
    <div id="p4" class="page"><div class="card"><h2>마이페이지</h2><div style="background:#1a1a1a; padding:30px; border:1px solid #333; text-align:center;"><h1 style="color:#fee500;">5,500 TKN / 55 COIN</h1></div></div></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8", authDomain: "real8-platform-8527b.firebaseapp.com", projectId: "real8-platform-8527b" };
    firebase.initializeApp(firebaseConfig);

    function handleJoin() {
        const e = document.getElementById('email').value, p = document.getElementById('pw').value;
        firebase.auth().createUserWithEmailAndPassword(e, p).then(() => alert("가입 완료! 이제 바로 입장 버튼을 누르세요.")).catch(err => alert(err.message));
    }

    function handleLogin() {
        const e = document.getElementById('email').value, p = document.getElementById('pw').value;
        firebase.auth().signInWithEmailAndPassword(e, p).then(res => {
            // 이메일 인증 체크를 아예 삭제했습니다. 바로 들어갑니다.
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('u-tag').innerText = res.user.email;
        }).catch(() => alert("아이디 또는 비번이 틀립니다."));
    }

    function goPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
        document.getElementById(id).classList.add('show');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
        el.classList.add('nav-active');
    }

    function makeHash() {
        const hash = CryptoJS.SHA256(document.getElementById('p-addr').value + new Date().toLocaleString()).toString();
        document.getElementById('hash-log').innerHTML = "<b>[공시 완료]</b><br>" + hash;
        alert("해시값이 성공적으로 공시되었습니다!");
    }
</script>
</body>
</html>
