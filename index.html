<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 - 통합 자산 관리 포털</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        /* [1] 네이버 스타일 로그인 디자인 */
        body { background-color: #f5f6f7; color: #333; font-family: sans-serif; margin: 0; }
        .login-wrap { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { width: 350px; padding: 40px; background: #fff; border: 1px solid #ddd; border-radius: 10px; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-green { width: 100%; padding: 15px; background: #03c75a; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }

        /* [2] 정린님의 소중한 다크 모드 디자인 (사진 106번 복구) */
        #main-service { background-color: #0d0d0d; color: #fff; min-height: 100vh; padding: 0; }
        .header-bar { background: #1a1a1a; padding: 15px 25px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        .content-area { padding: 30px; max-width: 1100px; margin: auto; }
        .admin-card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .yellow-text { color: #fee500; font-weight: bold; }
    </style>
</head>
<body>

<div id="auth-section" class="login-wrap">
    <div class="login-box">
        <h1 style="color: #03c75a;">Real8</h1>
        <input type="email" id="u-email" placeholder="이메일 주소">
        <input type="password" id="u-pw" placeholder="비밀번호">
        <button class="btn-green" onclick="handleJoin()">회원가입</button>
        <button class="btn-green" style="background:#444; margin-top:5px;" onclick="handleAuth()">로그인</button>
    </div>
</div>

<div id="main-service" class="hidden">
    <div class="header-bar">
        <div style="font-size:20px; font-weight:bold; color:#fee500;">Real8 Platform (Server)</div>
        <div style="font-size:14px;"><span id="user-display" class="yellow-text"></span>님 로그인 중 | <a href="#" onclick="location.reload()" style="color:#888;">로그아웃</a></div>
    </div>
    
    <div class="content-area">
        <div class="admin-card">
            <h3 style="border-left: 4px solid #fee500; padding-left: 10px;">토큰/코인 발행 기준 및 관리</h3>
            <p style="color:#888; font-size:13px;">🪙 관리자 설정 (지급 수량 & 환전율)</p>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top:20px;">
                <div>
                    <div style="margin-bottom:5px; font-size:12px;">1. 부동산 정보 등록 시 지급량</div>
                    <input type="text" value="500" style="background:#222; color:#fff; border:1px solid #444; width:100%;">
                </div>
                <div>
                    <div style="margin-bottom:5px; font-size:12px;">4. 주거문화 글쓰기 지급량</div>
                    <input type="text" value="50" style="background:#222; color:#fff; border:1px solid #444; width:100%;">
                </div>
            </div>
            <button style="background:#007bff; color:#fff; border:none; padding:10px 20px; border-radius:5px; margin-top:20px; width:100%;">설정 저장 및 공시</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
        authDomain: "real8-bc.firebaseapp.com",
        projectId: "real8-bc",
        appId: "1:792768508652:web:14557cae750168f46c6bc9"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function handleJoin() {
        const e = document.getElementById('u-email').value;
        const p = document.getElementById('u-pw').value;
        auth.createUserWithEmailAndPassword(e, p).then(() => alert("회원가입 성공!")).catch(a => alert(a.message));
    }

    function handleAuth() {
        const e = document.getElementById('u-email').value;
        const p = document.getElementById('u-pw').value;
        auth.signInWithEmailAndPassword(e, p).then((res) => {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-service').classList.remove('hidden');
            document.getElementById('user-display').innerText = res.user.email;
        }).catch(() => alert("아이디/비번 확인"));
    }
</script>
</body>
</html>
