<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 - 기획안 100% 복구본</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Malgun Gothic', sans-serif; }
        /* [복구] 회원가입 버튼이 있는 로그인 창 */
        #auth-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f5f6f7; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: #fff; padding: 40px; border-radius: 12px; width: 350px; text-align: center; color: #333; }
        .btn-green { width: 100%; padding: 15px; background: #03c75a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-yellow { width: 100%; padding: 15px; background: #fee500; color: #000; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* [복구] 사진 속 다크모드 디자인 */
        header { background: #2b579a; padding: 15px 25px; font-weight: bold; font-size: 20px; display: flex; justify-content: space-between; }
        nav { background: #1a1a1a; display: flex; border-bottom: 2px solid #333; }
        .nav-btn { padding: 15px 20px; cursor: pointer; color: #fff; border-right: 1px solid #222; font-size: 13px; }
        .nav-active { background: #fee500; color: #000; font-weight: bold; }
        .page { padding: 30px; display: none; }
        .active { display: block !important; }
        .card { border: 1px solid #fee500; padding: 25px; background: #0a0a0a; border-radius: 8px; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: #fee500; margin-top: 15px; }
        input, select, textarea { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="login-box">
        <h1 style="color:#03c75a">Real8</h1>
        <input type="email" id="email" placeholder="이메일 주소">
        <input type="password" id="pw" placeholder="비밀번호">
        <button class="btn-green" onclick="handleAuth(false)">로그인하기</button>
        <button class="btn-yellow" onclick="handleAuth(true)">신규 회원가입</button>
    </div>
</div>

<div id="main-app" style="display:none;">
    <header><span>Real8 Platform</span><div style="font-size:13px;"><span id="u-tag" style="color:#fee500;"></span>님 | <a onclick="location.reload()" style="color:#fff; cursor:pointer;">로그아웃</a></div></header>
    <nav>
        <div class="nav-btn nav-active" onclick="goPage('p-bc', this)">블록체인·토큰코인</div>
        <div class="nav-btn" onclick="goPage('p-build', this)">건축·매매·임대</div>
        <div class="nav-btn" onclick="goPage('p-virt', this)">가상건축</div>
        <div class="nav-btn" onclick="goPage('p-cult', this)">주거문화</div>
    </nav>

    <div id="p-bc" class="page active">
        <div class="card">
            <h2>토큰 발행 기준 설정 (사진 11번 복구)</h2>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div><label>부동산 등록 지급</label><input type="text" value="500"></div>
                <div><label>글쓰기 지급</label><input type="text" value="50"></div>
                <div><label>환전율</label><input type="text" id="rate" value="100"></div>
            </div>
            <label>📍 해시용 주소</label><input type="text" id="p-addr" value="경기도 가평군 설악면">
            <button class="btn-green" style="margin-top:20px;" onclick="makeHash()">저장 및 블록체인 공시</button>
            <div id="hash-log" style="margin-top:15px; color:#00ff00; word-break:break-all; font-family:monospace;"></div>
        </div>
    </div>

    <div id="p-build" class="page">
        <div class="card">
            <h2>부동산 정보 등록 (사진 12번 복구)</h2>
            <label>거래 종류</label><select><option>건축</option><option>매매</option></select>
            <label>나의 역할</label>
            <div style="margin-top:5px;"><input type="radio" name="r" style="width:20px;">갑 <input type="radio" name="r" style="width:20px;">을</div>
            <label>금액 (원)</label><input type="text" placeholder="금액 입력">
            <label>주소</label><input type="text" placeholder="주소 입력">
            <button class="btn-green" style="background:#28a745;">매물 등록</button>
        </div>
    </div>

    <div id="p-virt" class="page"><div class="card"><h2>가상건축 제안</h2><textarea style="height:150px;"></textarea><button class="btn-green">제출</button></div></div>
    <div id="p-cult" class="page"><div class="card"><h2>주거문화 공유</h2><textarea style="height:150px;"></textarea><button class="btn-green">등록</button></div></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8", authDomain: "real8-platform-8527b.firebaseapp.com", projectId: "real8-platform-8527b" };
    firebase.initializeApp(firebaseConfig);

    function handleAuth(isJoin) {
        const e = document.getElementById('email').value, p = document.getElementById('pw').value;
        if(isJoin) firebase.auth().createUserWithEmailAndPassword(e, p).then(() => alert("가입 성공!")).catch(err => alert(err.message));
        else firebase.auth().signInWithEmailAndPassword(e, p).then(r => {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('u-tag').innerText = r.user.email;
        }).catch(() => alert("확인 실패"));
    }

    function goPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
        el.classList.add('nav-active');
    }

    function makeHash() {
        const hash = CryptoJS.SHA256(document.getElementById('p-addr').value + new Date().toLocaleString()).toString();
        document.getElementById('hash-log').innerHTML = "<b>[공시 완료]</b><br>" + hash;
        alert("성공적으로 공시되었습니다!"); // 팝업 복구
    }
</script>
</body>
</html>
