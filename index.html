<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real8 - 부동산 디지털 자산 플랫폼</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* 사진 51, 86번의 다크 모드 디자인 완벽 복구 */
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Pretendard', sans-serif; margin: 0; overflow-x: hidden; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-card { background: #1a1a1a; padding: 40px; border-radius: 20px; width: 350px; text-align: center; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #262626; color: white; font-size: 16px; }
        button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-yellow { background: #fee500; color: #3c1e1e; }
        .btn-blue { background: #007bff; color: white; }
        .hidden { display: none !important; }
        
        /* 메인 대시보드 레이아웃 */
        .header { background: #1a1a1a; padding: 15px 25px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
        .container { padding: 30px; max-width: 1100px; margin: auto; }
        .card { background: #1a1a1a; border-radius: 15px; padding: 25px; margin-bottom: 25px; border: 1px solid #333; }
        .btn-success { background: #28a745; color: white; width: auto; padding: 10px 25px; font-size: 15px; }
        .property-item { padding: 15px; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; align-items: center; }
        .property-item:hover { background: #222; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1 style="color:#fee500; margin-bottom:10px;">Real8</h1>
            <p style="color:#888; margin-bottom:20px;">부동산 자산 관리 시스템</p>
            <input type="text" id="email" placeholder="아이디(이메일)">
            <input type="password" id="password" placeholder="비밀번호(6자리 이상)">
            <button class="btn-yellow" onclick="handleSignUp()">신규 회원가입</button>
            <button class="btn-blue" onclick="handleLogin()">로그인 및 관리자 입장</button>
        </div>
    </div>

    <div id="main-app" class="hidden">
        <div class="header">
            <div style="font-size: 22px; font-weight: bold; color: #fee500; letter-spacing: -1px;">Real8 <span style="font-size:14px; color:#666;">DIGITAL ASSET</span></div>
            <div id="user-display" style="font-size: 14px; color: #007bff; font-weight: 500;"></div>
        </div>

        <div class="container">
            <div style="display: flex; gap: 20px; margin-bottom: 25px;">
                <div class="card" style="flex: 1; margin-bottom: 0;">
                    <div style="color: #888; font-size: 14px;">나의 보유 코인</div>
                    <div style="font-size: 28px; font-weight: bold; color: #fee500; margin-top: 5px;">1,250,000 <span style="font-size:16px;">P</span></div>
                </div>
                <div class="card" style="flex: 1; margin-bottom: 0;">
                    <div style="color: #888; font-size: 14px;">시스템 상태</div>
                    <div style="font-size: 28px; font-weight: bold; color: #28a745; margin-top: 5px;">SERVER ON</div>
                </div>
            </div>

            <div class="card">
                <h3 style="margin-top: 0; margin-bottom: 20px; display: flex; align-items: center;">
                    <span style="margin-right: 10px;">🏠</span> 매물 등록 및 데이터 전송
                </h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="prop-title" placeholder="매물 명칭" style="flex: 2; margin: 0;">
                    <input type="text" id="prop-price" placeholder="평가 금액" style="flex: 1; margin: 0;">
                    <button class="btn-success" onclick="addProperty()">+ 새 매물 등록</button>
                </div>
            </div>

            <div class="card">
                <h3 style="margin-top: 0;">📋 실시간 매물 리스트</h3>
                <div id="property-list">
                    <p style="color: #555;">데이터를 불러오는 중입니다...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 사진 64번 구글 열쇠 정보 적용
        const firebaseConfig = {
            apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
            authDomain: "real8-bc.firebaseapp.com",
            projectId: "real8-bc",
            databaseURL: "https://real8-bc-default-rtdb.firebaseio.com",
            appId: "1:792768508652:web:14557cae750168f46c6bc9"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.database();

        // [기능 1] 회원가입
        function handleSignUp() {
            const email = document.getElementById('email').value;
            const pw = document.getElementById('password').value;
            if(!email || !pw) return alert("항목을 모두 입력하세요.");
            auth.createUserWithEmailAndPassword(email, pw)
                .then(() => alert("회원가입 성공! 이제 로그인을 진행하세요."))
                .catch(err => alert("오류: " + err.message));
        }

        // [기능 2] 로그인 및 화면 전환 (사진 86번 상태로 진입)
        function handleLogin() {
            const email = document.getElementById('email').value;
            const pw = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, pw)
                .then(() => {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    document.getElementById('user-display').innerText = email + "님 접속 중";
                    listenData(); // 로그인 성공 시 데이터 불러오기
                })
                .catch(err => alert("로그인 정보가 틀립니다."));
        }

        // [기능 3] 매물 데이터를 서버에 영구 저장 (정린님이 원하신 핵심 기능)
        function addProperty() {
            const title = document.getElementById('prop-title').value;
            const price = document.getElementById('prop-price').value;
            if(!title || !price) return alert("내용을 입력해주세요.");

            db.ref('real-estate').push({
                title: title,
                price: price,
                time: new Date().toLocaleString()
            }).then(() => {
                alert("구글 서버 저장 완료!");
                document.getElementById('prop-title').value = "";
                document.getElementById('prop-price').value = "";
            });
        }

        // [기능 4] 서버에서 데이터를 실시간으로 가져와 화면에 그리기
        function listenData() {
            db.ref('real-estate').on('value', (snapshot) => {
                const listDiv = document.getElementById('property-list');
                listDiv.innerHTML = "";
                if (!snapshot.exists()) {
                    listDiv.innerHTML = "<p style='color:#555;'>등록된 매물이 없습니다.</p>";
                    return;
                }
                snapshot.forEach((child) => {
                    const data = child.val();
                    listDiv.innerHTML += `
                        <div class="property-item">
                            <div>
                                <strong style="color:#fee500; font-size:17px;">${data.title}</strong><br>
                                <span style="color:#888; font-size:12px;">등록시간: ${data.time}</span>
                            </div>
                            <div style="font-weight:bold; color:#fff;">${data.price}</div>
                        </div>`;
                });
            });
        }
    </script>
</body>
</html>
