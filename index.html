<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 v2026 - 통합 자산 플랫폼</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Malgun Gothic', sans-serif; }
        #auth-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f5f6f7; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-box { background: #fff; padding: 45px; border-radius: 12px; width: 360px; text-align: center; color: #333; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        header { background: #2b579a; padding: 18px 25px; display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; border-bottom: 3px solid #003d80; }
        nav { background: #1a1a1a; display: flex; border-bottom: 2px solid #333; }
        .nav-btn { padding: 15px 25px; cursor: pointer; font-size: 14px; border-right: 1px solid #222; color: #fff; }
        .nav-on { background: #fee500; color: #000; font-weight: bold; }
        .page { padding: 40px; display: none; max-width: 1050px; margin: 0 auto; }
        .active { display: block !important; }
        .card { border: 1px solid #fee500; padding: 30px; background: #0a0a0a; border-radius: 8px; margin-bottom: 25px; }
        label { display: block; font-size: 13px; color: #fee500; margin-bottom: 8px; }
        input, select, textarea { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 12px; margin-top: 5px; box-sizing: border-box; }
        .btn-blue { background: #007bff; color: white; border: none; padding: 18px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 25px; }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="login-box">
        <h1 style="color:#03c75a; font-size:42px;">Real8</h1>
        <p style="color:#888; margin-bottom:30px;">본인 확인 후 기획하신 시스템이 열립니다.</p>
        <input type="email" id="u-email" placeholder="이메일 주소">
        <input type="password" id="u-pw" placeholder="비밀번호">
        <button onclick="handleAuth(false)" class="btn-blue" style="background:#03c75a; margin-top:15px;">로그인하여 시스템 열기</button>
        <button onclick="handleAuth(true)" class="btn-blue" style="background:#ffc107; color:#000; margin-top:8px;">회원가입</button>
    </div>
</div>

<div id="main-sys" style="display:none;">
    <header>
        <span>Real8 Platform (Final 2026)</span>
        <div style="font-size:13px;"><span id="u-tag" style="color:#fee500;"></span>님 접속 | <a onclick="location.reload()" style="cursor:pointer; color:#fff;">로그아웃</a></div>
    </header>
    
    <nav>
        <div class="nav-btn nav-on" onclick="showPage('p2', this)">블록체인·토큰코인</div>
        <div class="nav-btn" onclick="showPage('p3', this)">건축·매매·임대·펜션</div>
        <div class="nav-btn" onclick="showPage('p4', this)">가상건축</div>
        <div class="nav-btn" onclick="showPage('p5', this)">주거문화</div>
        <div class="nav-btn" onclick="showPage('p6', this)">마이페이지</div>
    </nav>

    <div id="p2" class="page active">
        <div class="card">
            <h2>토큰/코인 발행 및 블록체인 공시</h2>
            <label>📍 해시 연계용 부동산 주소 (재료 1)</label>
            <input type="text" id="p-addr" value="경기도 가평군 설악면">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:15px;">
                <div><label>부동산 등록 지급량</label><input type="text" value="500"></div>
                <div><label>환전율 (토큰->코인)</label><input type="text" value="100"></div>
            </div>
            <button class="btn-blue" onclick="makeHash()">설정 저장 및 진짜 해시 공시</button>
            <div id="hash-log" style="margin-top:20px; color:#00ff00; word-break:break-all; font-family:monospace; padding:10px; border:1px dashed #444;"></div>
        </div>
    </div>

    <div id="p3" class="page">
        <div class="card">
            <h2>부동산 정보 등록</h2>
            <label>1. 거래 종류</label><select><option>건축</option><option>매매</option><option>임대</option></select>
            <label style="margin-top:20px;">4. 주소 (중복불가)</label><input type="text" placeholder="사진 22번처럼 주소를 입력하세요.">
            <button class="btn-blue" style="background:#28a745;">매물 정보 등록</button>
        </div>
    </div>

    <div id="p4" class="page">
        <div class="card">
            <h2>가상건축 프로젝트 제안</h2>
            <input type="text" placeholder="제안 제목" style="margin-bottom:15px;">
            <textarea style="height:150px;" placeholder="상세 제안 내용을 입력하세요."></textarea>
            <button class="btn-blue">제안 제출하기</button>
        </div>
    </div>

    <div id="p5" class="page">
        <div class="card"><h2>주거문화 공유</h2><textarea style="height:200px;" placeholder="나만의 주거 문화를 공유해 주세요."></textarea><button class="btn-blue">등록</button></div>
    </div>

    <div id="p6" class="page">
        <div class="card"><h3>마이페이지</h3><p>회원님의 활동 내역과 보유 자산이 여기에 표시됩니다.</p></div>
    </div>
</div>

<script>
    // 사진 27번의 정린님 진짜 엔진 정보 적용
    const firebaseConfig = { 
        apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8", 
        authDomain: "real8-platform-8527b.firebaseapp.com", 
        projectId: "real8-platform-8527b", 
        appId: "1:268345019156:web:86566497745778a4783307" 
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function handleAuth(isJoin) {
        const e = document.getElementById('u-email').value, p = document.getElementById('u-pw').value;
        if(isJoin) auth.createUserWithEmailAndPassword(e, p).then(() => alert("가입 성공!")).catch(err => alert(err.message));
        else auth.signInWithEmailAndPassword(e, p).then(res => {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('main-sys').style.display = 'block';
            document.getElementById('u-tag').innerText = res.user.email;
        }).catch(() => alert("아이디 또는 비번이 틀립니다. 가입부터 해주세요."));
    }

    function showPage(id, el) {
        document.querySelectorAll('.page').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-on'));
        el.classList.add('nav-on');
    }

    function makeHash() {
        const addr = document.getElementById('p-addr').value;
        const hash = CryptoJS.SHA256(addr + window.location.href + new Date().toLocaleString()).toString();
        document.getElementById('hash-log').innerHTML = "<b>[공시 완료]</b><br>Hash: " + hash;
        alert("해시값이 성공적으로 생성되었습니다.");
    }
</script>
</body>
</html>
