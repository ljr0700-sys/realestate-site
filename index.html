<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 v2026 Final - 본인확인 통합시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 사진 속 다크모드 디자인 완벽 재현 */
        body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: #000; color: #fff; }
        .hidden { display: none !important; }
        #auth-gate { background: #f5f6f7; height: 100vh; display: flex; align-items: center; justify-content: center; position: fixed; width: 100%; z-index: 10000; }
        .login-box { background: #fff; padding: 45px; border-radius: 12px; width: 360px; text-align: center; color: #333; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header-blue { background: #2b579a; padding: 18px 25px; display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; border-bottom: 3px solid #003d80; }
        .menu-bar { background: #1a1a1a; display: flex; border-bottom: 1px solid #333; }
        .menu-item { padding: 15px 25px; font-size: 14px; color: #fff; cursor: pointer; border-right: 1px solid #222; }
        .menu-active { background: #fee500; color: #000; font-weight: bold; }
        .page-area { padding: 40px; max-width: 1000px; display: none; }
        .show { display: block !important; }
        .card { border: 1px solid #fee500; padding: 30px; border-radius: 8px; background: #0a0a0a; margin-bottom: 20px; }
        input, select, textarea { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 12px; margin-top: 10px; box-sizing: border-box; }
        .btn-blue { background: #007bff; color: white; border: none; padding: 18px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="login-box">
        <h1 style="color:#03c75a;">Real8</h1>
        <p style="color:#888; margin-bottom:30px;">본인 확인 후 포털 이용이 가능합니다</p>
        <input type="email" id="email" placeholder="이메일 주소">
        <input type="password" id="pw" placeholder="비밀번호">
        <button class="btn-blue" onclick="handleAuth(false)" style="background:#03c75a;">로그인</button>
        <button class="btn-blue" onclick="handleAuth(true)" style="background:#ffc107; color:#000; margin-top:8px;">회원가입</button>
    </div>
</div>

<div id="main-sys" class="hidden">
    <div class="header-blue">
        <span>Real8 Platform (Final v2026)</span>
        <div style="font-size:13px;"><span id="u-tag" style="color:#fee500;"></span>님 접속 중 | <button onclick="location.reload()" style="background:none; border:none; color:#fff; cursor:pointer;">로그아웃</button></div>
    </div>
    <div class="menu-bar">
        <div class="menu-item" onclick="goPage('home', this)">홈·안내</div>
        <div class="menu-item menu-active" onclick="goPage('bc', this)">블록체인·토큰코인</div>
        <div class="menu-item" onclick="goPage('build', this)">건축·매매·임대·펜션</div>
        <div class="menu-item" onclick="goPage('virt', this)">가상건축</div>
        <div class="menu-item" onclick="goPage('cult', this)">주거문화</div>
        <div class="menu-item" onclick="goPage('my', this)">마이페이지</div>
    </div>

    <div id="home" class="page-area"><div class="card"><h3>Real8 이용 안내</h3><p>모든 정보는 구글 서버에 저장되며 해시를 통해 공시됩니다.</p></div></div>
    
    <div id="bc" class="page-area show">
        <div class="card">
            <h2 style="margin-top:0;">토큰/코인 발행 및 관리</h2>
            <label>📍 해시 연계용 부동산 주소</label><input type="text" id="p-addr" value="경기도 가평군 설악면">
            <button class="btn-blue" onclick="makeHash()">설정 저장 및 해시 공시</button>
            <div id="hash-out" style="margin-top:20px; color:#00ff00; font-family:monospace; word-break:break-all;"></div>
        </div>
    </div>

    <div id="build" class="page-area">
        <div class="card">
            <h3>부동산 정보 등록</h3>
            <label>거래 종류</label><select><option>건축</option><option>매매</option><option>임대</option></select>
            <label>주소</label><input type="text" placeholder="매물 주소를 입력하세요.">
            <button class="btn-blue" style="background:#28a745;">정보 등록</button>
        </div>
    </div>

    <div id="virt" class="page-area"><div class="card"><h3>가상건축 제안</h3><textarea style="height:150px;" placeholder="제안 내용을 입력하세요."></textarea><button class="btn-blue">제안 제출</button></div></div>
    <div id="cult" class="page-area"><div class="card"><h3>주거문화 정보</h3><textarea style="height:200px;" placeholder="경험을 공유해 주세요."></textarea><button class="btn-blue">글 등록</button></div></div>
    <div id="my" class="page-area"><div class="card"><h3>마이페이지</h3><p>회원님의 활동 및 자산 현황입니다.</p></div></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8", authDomain: "real8-bc.firebaseapp.com", projectId: "real8-bc", appId: "1:792768508652:web:14557cae750168f46c6bc9" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function handleAuth(isJoin) {
        const e = document.getElementById('email').value, p = document.getElementById('pw').value;
        if(isJoin) auth.createUserWithEmailAndPassword(e,p).then(()=>alert("가입 성공")).catch(a=>alert(a.message));
        else auth.signInWithEmailAndPassword(e,p).then(r=>{
            document.getElementById('auth-gate').classList.add('hidden');
            document.getElementById('main-sys').classList.remove('hidden');
            document.getElementById('u-tag').innerText = r.user.email;
        }).catch(()=>alert("정보 확인 실패"));
    }

    function goPage(id, el) {
        document.querySelectorAll('.page-area').forEach(p=>p.classList.remove('show'));
        document.getElementById(id).classList.add('show');
        document.querySelectorAll('.menu-item').forEach(m=>m.classList.remove('menu-active'));
        el.classList.add('menu-active');
    }

    function makeHash() {
        const raw = document.getElementById('p-addr').value + window.location.href + new Date().toLocaleString();
        const hash = CryptoJS.SHA256(raw).toString();
        document.getElementById('hash-out').innerHTML = "<b>[해시 공시]</b><br>" + hash;
        alert("성공적으로 공시되었습니다.");
    }
</script>
</body>
</html>
