<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real8 - 최종 통합 플랫폼</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #0d0d0d; color: #e0e0e0; font-family: 'Pretendard', sans-serif; margin: 0; }
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-card { background: #1a1a1a; padding: 40px; border-radius: 20px; width: 350px; text-align: center; border: 1px solid #333; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #262626; color: white; }
        button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-yellow { background: #fee500; color: #3c1e1e; }
        .btn-blue { background: #007bff; color: white; }
        .hidden { display: none !important; }
        .header { background: #1a1a1a; padding: 15px 25px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 30px; max-width: 1000px; margin: auto; }
        .card { background: #1a1a1a; border-radius: 15px; padding: 25px; margin-bottom: 25px; border: 1px solid #333; }
        .btn-success { background: #28a745; color: white; width: auto; padding: 10px 25px; }
        .list-item { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h1 style="color:#fee500;">Real8</h1>
        <p style="color:#888;">부동산 디지털 자산 플랫폼</p>
        <input type="text" id="email" placeholder="이메일 아이디">
        <input type="password" id="password" placeholder="비밀번호">
        <button class="btn-yellow" onclick="handleSignUp()">신규 회원가입</button>
        <button class="btn-blue" onclick="handleLogin()">로그인 및 입장</button>
    </div>
</div>

<div id="main-app" class="hidden">
    <div class="header">
        <div style="font-size: 20px; font-weight: bold; color: #fee500;">Real8 ADMIN</div>
        <div id="user-display" style="font-size: 14px; color: #007bff;"></div>
    </div>
    <div class="container">
        <div class="card">
            <h3 style="margin-top:0;">🏠 실시간 매물 등록</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="p-title" placeholder="매물명">
                <input type="text" id="p-price" placeholder="금액">
                <button class="btn-success" onclick="addP()">+ 등록하기</button>
            </div>
        </div>
        <div class="card">
            <h3>📋 등록된 매물 리스트</h3>
            <div id="p-list" style="color:#666;">데이터 연결 성공! 매물을 등록해 보세요.</div>
        </div>
    </div>
</div>

<script>
    // 사진 102번의 실제 데이터베이스 주소를 정확히 입력했습니다.
    const firebaseConfig = {
        apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
        authDomain: "real8-bc.firebaseapp.com",
        projectId: "real8-bc",
        databaseURL: "https://real8-bc-default-rtdb.firebaseio.com",
        appId: "1:792768508652:web:14557cae750168f46c6bc9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function handleSignUp() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        auth.createUserWithEmailAndPassword(e, p).then(() => alert("가입 성공")).catch(a => alert(a.message));
    }

    function handleLogin() {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(e, p).then(() => {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-display').innerText = e + "님 접속 중";
            loadP();
        }).catch(a => alert("로그인 실패"));
    }

    function addP() {
        const t = document.getElementById('p-title').value;
        const pr = document.getElementById('p-price').value;
        if(!t || !pr) return alert("정보를 입력하세요.");
        
        // 장부(properties)에 데이터 기록
        db.ref('properties').push({
            title: t,
            price: pr,
            time: new Date().toLocaleString()
        }).then(() => {
            alert("서버 저장 완료!");
            document.getElementById('p-title').value = "";
            document.getElementById('p-price').value = "";
        });
    }

    function loadP() {
        db.ref('properties').on('value', (s) => {
            const list = document.getElementById('p-list');
            list.innerHTML = "";
            if (!s.exists()) { list.innerHTML = "등록된 매물이 없습니다."; return; }
            s.forEach((c) => {
                const d = c.val();
                list.innerHTML += `<div class="list-item"><b>${d.title}</b> <span>${d.price}</span></div>`;
            });
        });
    }
</script>
</body>
</html>
