<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 V13 - 최종 통합본</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root { --bg: #121212; --blue: #0056b3; --yellow: #FEE500; }
        body { margin: 0; background: var(--bg); color: #e0e0e0; font-family: 'Noto Sans KR', sans-serif; }
        header { background: var(--blue); padding: 15px 20px; display: flex; justify-content: space-between; font-weight: bold; }
        nav { background: #000; display: flex; border-bottom: 1px solid #333; }
        .nav-btn { padding: 15px 20px; color: #888; cursor: pointer; border-right: 1px solid #222; font-size: 14px; }
        .nav-active { background: var(--yellow) !important; color: #000 !important; font-weight: bold; }
        .page { padding: 30px; display: none; }
        .active { display: block !important; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; }
        input, select, textarea { width: 95%; padding: 12px; background: #2c2c2c; border: 1px solid #444; color: #fff; margin-top: 5px; }
        button { width: 100%; padding: 15px; background: #0d6efd; color: #fff; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #auth-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; align-items: center; justify-content: center; z-index: 10000; }
    </style>
</head>
<body>

<div id="auth-gate">
    <div style="background:#1e1e1e; padding:40px; border-radius:12px; width:350px; text-align:center; border:1px solid #333;">
        <h1 style="color:#fff;">Real8</h1>
        <input type="email" id="u-email" placeholder="아이디">
        <input type="password" id="u-pw" placeholder="비밀번호">
        <button onclick="login()" style="background:var(--yellow); color:#000;">본인 확인 후 바로 입장</button>
        <button onclick="join()" style="background:#444; margin-top:10px;">회원가입</button>
    </div>
</div>

<div id="main-app" style="display:none;">
    <header>Real8 Platform <span id="u-tag" style="font-size:12px; color:var(--yellow); margin-left:10px;"></span></header>
    <nav>
        <div class="nav-btn nav-active" onclick="go('p1', this)">블록체인·토큰코인</div>
        <div class="nav-btn" onclick="go('p2', this)">건축·매매·임대</div>
        <div class="nav-btn" onclick="go('p3', this)">가상건축</div>
        <div class="nav-btn" onclick="go('p4', this)">마이페이지</div>
    </nav>

    <div class="page active" id="p1">
        <div class="card">
            <h3 style="color:var(--yellow);">블록체인 해시 공시</h3>
            <label>공시 주소</label><input type="text" id="p-addr" value="경기도 가평군 설악면">
            <button onclick="makeHash()" style="background:var(--yellow); color:#000;">저장 및 진짜 해시 공시</button>
            <div id="hash-log" style="margin-top:20px; color:#28a745; word-break:break-all; font-family:monospace;"></div>
        </div>
    </div>
    <div class="page" id="p2"><div class="card"><h3>정보 등록</h3><input type="text" placeholder="주소 입력"><button>등록</button></div></div>
    <div class="page" id="p3"><div class="card"><h3>가상건축</h3><textarea style="height:150px;"></textarea><button>제안</button></div></div>
    <div class="page" id="p4"><div class="card"><h3>마이페이지</h3><p>보유 자산: 5,500 TKN</p></div></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8", authDomain: "real8-platform-8527b.firebaseapp.com", projectId: "real8-platform-8527b" };
    firebase.initializeApp(firebaseConfig);

    function join() {
        const e = document.getElementById('u-email').value, p = document.getElementById('u-pw').value;
        firebase.auth().createUserWithEmailAndPassword(e, p).then(() => alert("가입 완료!")).catch(err => alert(err.message));
    }
    function login() {
        const e = document.getElementById('u-email').value, p = document.getElementById('u-pw').value;
        firebase.auth().signInWithEmailAndPassword(e, p).then(res => {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('u-tag').innerText = res.user.email;
        }).catch(() => alert("아이디/비번 확인 실패"));
    }
    function go(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
        el.classList.add('nav-active');
    }
    function makeHash() {
        const h = CryptoJS.SHA256(document.getElementById('p-addr').value + new Date().getTime()).toString();
        document.getElementById('hash-log').innerHTML = "<b>[공시 완료]</b><br>" + h;
        alert("해시값이 성공적으로 공시되었습니다!");
    }
</script>
</body>
</html>
