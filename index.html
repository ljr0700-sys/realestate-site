<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 Platform (Server)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Malgun Gothic', sans-serif; background: #000; color: #fff; }
        .hidden { display: none !important; }
        
        /* [1] 로그인 전 보이는 네이버 스타일 대문 */
        #auth-gate { background: #f5f6f7; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; padding: 40px; border: 1px solid #ddd; border-radius: 8px; width: 360px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-box input { width: 100%; padding: 13px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; color: #000; }
        .btn-green { width: 100%; padding: 15px; background: #03c75a; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 17px; }

        /* [2] 정린님의 사진 113번 디자인 완벽 복구 */
        .header-blue { background: #2b579a; padding: 18px 25px; display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; }
        .menu-bar { background: #1a1a1a; display: flex; border-bottom: 1px solid #333; }
        .menu-item { padding: 15px 20px; font-size: 14px; color: #fff; cursor: pointer; border-right: 1px solid #222; }
        .menu-item:hover { background: #333; }
        .active-yellow { background: #fee500; color: #000; font-weight: bold; }
        
        .main-content { padding: 40px; max-width: 950px; }
        .admin-box { border: 1px solid #fee500; padding: 30px; border-radius: 5px; background: #0a0a0a; position: relative; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; }
        .field label { display: block; font-size: 13px; color: #fee500; margin-bottom: 8px; }
        .field input { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 3px; font-size: 16px; box-sizing: border-box; }
        
        .btn-blue { background: #007bff; color: white; border: none; padding: 18px; width: 100%; border-radius: 5px; font-weight: bold; margin-top: 30px; cursor: pointer; font-size: 18px; }
        
        /* 해시값 공시 페이지 효과 */
        #hash-display-area { margin-top: 30px; padding: 20px; background: #111; border: 1px dashed #fee500; border-radius: 5px; font-family: monospace; color: #00ff00; word-break: break-all; line-height: 1.6; }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="login-box">
        <h1 style="color:#03c75a; margin-bottom:30px;">Real8</h1>
        <input type="email" id="u-email" placeholder="이메일 주소">
        <input type="password" id="u-pw" placeholder="비밀번호">
        <button class="btn-green" onclick="handleAuth(false)">로그인하기</button>
        <button class="btn-green" style="background:#ffc107; color:#000; margin-top:5px;" onclick="handleAuth(true)">신규 회원가입</button>
    </div>
</div>

<div id="main-system" class="hidden">
    <div class="header-blue">
        <span>Real8 Platform (Server)</span>
        <div style="font-size:13px; font-weight:normal;">
            <span id="user-display" style="color:#fee500;"></span>님 접속 중 | 
            <button onclick="location.reload()" style="background:none; border:none; color:#fff; cursor:pointer; text-decoration:underline;">로그아웃</button>
        </div>
    </div>
    
    <div class="menu-bar">
        <div class="menu-item" onclick="alert('홈 화면으로 이동합니다.')">홈·안내</div>
        <div class="menu-item active-yellow">블록체인·토큰코인</div>
        <div class="menu-item" onclick="alert('건축·매매 페이지입니다.')">건축·매매·임대·펜션</div>
        <div class="menu-item" onclick="alert('가상건축 페이지입니다.')">가상건축</div>
        <div class="menu-item" onclick="alert('주거문화 페이지입니다.')">주거문화</div>
        <div class="menu-item" onclick="alert('마이페이지로 이동합니다.')">마이페이지</div>
    </div>

    <div class="main-content">
        <div id="token-section" class="admin-box">
            <h2 style="margin:0; font-size:24px;">토큰/코인 발행 기준 및 관리</h2>
            <p style="color:#fee500; font-size:14px; margin-top:10px;">⚙️ 블록체인 기반 데이터 공시 설정</p>
            
            <div style="margin-top:25px; padding:20px; background:#1a1a1a; border-radius:6px; border-left:4px solid #007bff;">
                <label style="color:#aaa; font-size:12px;">📍 해시 연계용 부동산 주소 (재료 1)</label>
                <input type="text" id="prop-addr" value="경기도 가평군 설악면" style="width:100%; background:transparent; border:none; border-bottom:1px solid #444; color:#fff; font-size:18px; padding:10px 0;">
            </div>

            <div class="input-grid">
                <div class="field"><label>1. 부동산 정보 등록 시 지급량</label><input type="text" id="v1" value="500"></div>
                <div class="field"><label>4. 주거문화 글쓰기 지급량</label><input type="text" id="v4" value="50"></div>
                <div class="field"><label>2. 가상건축 제안 지급량</label><input type="text" id="v2" value="100"></div>
                <div class="field"><label>5. 주거문화 댓글 지급량</label><input type="text" id="v5" value="20"></div>
                <div class="field"><label>3. 가상건축 참여 지급량</label><input type="text" id="v3" value="20"></div>
                <div class="field"><label style="color:#ff4d4d;">🔴 환전율 (토큰 -> 1코인)</label><input type="text" id="vex" value="100"></div>
            </div>
            
            <button class="btn-blue" onclick="runOfficialPublish()">설정 저장 및 블록체인 해시 공시</button>
            
            <div id="hash-display-area" class="hidden">
                <b style="color:#fee500; font-size:16px;">[블록체인 데이터 공시 증명서]</b><br>
                • 연계 주소: <span id="res-addr"></span><br>
                • 사이트: <span id="res-site"></span><br>
                • 발행 일시: <span id="res-time"></span><br>
                <hr style="border:0; border-top:1px dashed #555; margin:10px 0;">
                • 생성된 보안 해시(HASH): <br>
                <span id="res-hash" style="color:#fff; font-weight:bold;"></span>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8",
        authDomain: "real8-bc.firebaseapp.com",
        projectId: "real8-bc",
        appId: "1:792768508652:web:14557cae750168f46c6bc9"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function handleAuth(isJoin) {
        const e = document.getElementById('u-email').value, p = document.getElementById('u-pw').value;
        if(isJoin) {
            auth.createUserWithEmailAndPassword(e, p).then(() => alert("본인 확인 완료! 가입되었습니다.")).catch(a => alert(a.message));
        } else {
            auth.signInWithEmailAndPassword(e, p).then(res => {
                document.getElementById('auth-gate').classList.add('hidden');
                document.getElementById('main-system').classList.remove('hidden');
                document.getElementById('user-display').innerText = res.user.email;
            }).catch(() => alert("정보가 틀립니다."));
        }
    }

    // 정린님의 핵심 로직: 주소+사이트+시간 연계 공시 기능
    function runOfficialPublish() {
        const addr = document.getElementById('prop-addr').value;
        const site = window.location.href;
        const time = new Date().toLocaleString();
        
        // 3가지 연계 데이터 묶기
        const rawData = addr + "|" + site + "|" + time;
        const hash = CryptoJS.SHA256(rawData).toString();
        
        // 결과창 표시
        document.getElementById('hash-display-area').classList.remove('hidden');
        document.getElementById('res-addr').innerText = addr;
        document.getElementById('res-site').innerText = site;
        document.getElementById('res-time').innerText = time;
        document.getElementById('res-hash').innerText = hash;
        
        alert("정린님, 블록체인 해시값이 정상적으로 생성되어 공시되었습니다.");
    }
</script>
</body>
</html>
