<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 Portal - 완벽 복구본</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Malgun Gothic', sans-serif; }
        #auth-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-box { background: #fff; padding: 40px; border-radius: 12px; width: 320px; text-align: center; color: #333; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        header { background: #2b579a; padding: 20px; font-weight: bold; font-size: 20px; display: flex; justify-content: space-between; }
        nav { background: #1a1a1a; display: flex; border-bottom: 2px solid #333; }
        .nav-btn { padding: 15px 25px; cursor: pointer; color: #fff; border-right: 1px solid #222; font-size: 14px; }
        .nav-on { background: #fee500; color: #000; font-weight: bold; }
        .page { padding: 40px; display: none; }
        .active { display: block !important; }
        .card { border: 1px solid #fee500; padding: 30px; background: #0a0a0a; border-radius: 8px; }
        input, select, textarea { width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; margin-top: 10px; }
        .btn-blue { background: #007bff; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="login-box">
        <h1 style="color:#03c75a">Real8</h1>
        <input type="email" id="email" placeholder="아이디" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd;">
        <input type="password" id="pw" placeholder="비밀번호" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ddd;">
        <button onclick="login()" style="width:100%; padding:12px; background:#03c75a; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">본인 확인 후 입장</button>
    </div>
</div>

<div id="main-app" style="display:none;">
    <header><span>Real8 Platform</span><div style="font-size:13px;"><span id="u-tag" style="color:#fee500;"></span>님 | <a onclick="location.reload()" style="color:#fff; cursor:pointer;">로그아웃</a></div></header>
    <nav>
        <div class="nav-btn nav-on" onclick="goPage('p-bc', this)">블록체인·토큰코인</div>
        <div class="nav-btn" onclick="goPage('p-build', this)">건축·매매·임대</div>
    </nav>

    <div id="p-bc" class="page active">
        <div class="card">
            <h2>토큰 발행 및 해시 공시</h2>
            <label>📍 부동산 주소</label>
            <input type="text" id="p-addr" value="경기도 가평군 설악면">
            <button class="btn-blue" onclick="makeHash()">설정 저장 및 해시 공시</button>
            <div id="hash-log" style="margin-top:20px; color:#00ff00; word-break:break-all; font-family:monospace;"></div>
        </div>
    </div>

    <div id="p-build" class="page">
        <div class="card">
            <h2>부동산 정보 등록</h2>
            <label>주소</label><input type="text" placeholder="주소를 입력하세요.">
            <button class="btn-blue" style="background:#28a745;">정보 등록</button>
        </div>
    </div>
</div>

<script>
    // 지워진 app.js의 로직을 여기에 다 살려냈습니다
    const firebaseConfig = { apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8", authDomain: "real8-platform-8527b.firebaseapp.com", projectId: "real8-platform-8527b" };
    firebase.initializeApp(firebaseConfig);

    function login() {
        const e = document.getElementById('email').value, p = document.getElementById('pw').value;
        firebase.auth().signInWithEmailAndPassword(e, p).then(r => {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('u-tag').innerText = r.user.email;
        }).catch(() => alert("아이디/비번 확인 실패"));
    }

    function goPage(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-on'));
        el.classList.add('nav-on');
    }

    // [중요] 정린님이 지우셨던 그 '팝업'과 '해시' 기능을 다시 만들었습니다
    function makeHash() {
        const addr = document.getElementById('p-addr').value;
        const hash = CryptoJS.SHA256(addr + new Date().toLocaleString()).toString();
        document.getElementById('hash-log').innerHTML = "<b>[공시 완료]</b><br>해시값: " + hash;
        alert("축하합니다! 해시값이 정상적으로 공시되었습니다."); // 팝업창 복구
    }
</script>
</body>
</html>
