<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Real8 v2026 - 완결 통합 시스템</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 사진 속 다크모드 디자인 100% 복구 */
        body { margin: 0; background: #000; color: #fff; font-family: 'Malgun Gothic', sans-serif; overflow-x: hidden; }
        #auth-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f5f6f7; display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .login-box { background: #fff; padding: 45px; border-radius: 12px; width: 360px; text-align: center; color: #333; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        header { background: #2b579a; padding: 18px 25px; display: flex; justify-content: space-between; font-weight: bold; font-size: 20px; border-bottom: 3px solid #003d80; }
        nav { background: #1a1a1a; display: flex; border-bottom: 2px solid #333; }
        .nav-btn { padding: 15px 20px; cursor: pointer; font-size: 14px; border-right: 1px solid #222; color: #fff; }
        .nav-on { background: #fee500 !important; color: #000 !important; font-weight: bold; }
        .container { padding: 40px; display: none; max-width: 1000px; margin: 0 auto; }
        .show { display: block !important; }
        .card { border: 1px solid #fee500; padding: 30px; background: #0a0a0a; border-radius: 8px; margin-bottom: 25px; }
        label { display: block; font-size: 13px; color: #fee500; margin-bottom: 8px; }
        input, select, textarea { width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .btn-blue { background: #007bff; color: white; border: none; padding: 18px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }
        #hash-log { margin-top: 20px; padding: 15px; background: #111; border: 1px dashed #555; color: #00ff00; word-break: break-all; font-family: monospace; }
    </style>
</head>
<body>

<div id="auth-gate">
    <div class="login-box">
        <h1 style="color:#03c75a; font-size: 40px; margin-bottom: 25px;">Real8</h1>
        <input type="email" id="u-email" placeholder="이메일 주소" style="width:100%; padding:15px; margin-bottom:10px; border:1px solid #ddd; border-radius:6px;">
        <input type="password" id="u-pw" placeholder="비밀번호" style="width:100%; padding:15px; margin-bottom:20px; border:1px solid #ddd; border-radius:6px;">
        <button onclick="handleAuth(false)" style="width:100%; padding:16px; background:#03c75a; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">로그인</button>
        <button onclick="handleAuth(true)" style="width:100%; padding:12px; background:#fff; color:#666; border:1px solid #ccc; border-radius:6px; margin-top:10px; cursor:pointer;">회원가입</button>
    </div>
</div>

<div id="main-sys" style="display:none;">
    <header>
        <span>Real8 Platform (Final v2026)</span>
        <div style="font-size:13px;"><span id="u-tag" style="color:#fee500;"></span>님 접속 | <a onclick="location.reload()" style="cursor:pointer; text-decoration:underline;">로그아웃</a></div>
    </header>
    
    <nav>
        <div class="nav-btn" onclick="goPage('home', this)">홈·안내</div>
        <div class="nav-btn nav-on" onclick="goPage('bc', this)">블록체인·토큰코인</div>
        <div class="nav-btn" onclick="goPage('build', this)">건축·매매·임대·펜션</div>
        <div class="nav-btn" onclick="goPage('virt', this)">가상건축</div>
        <div class="nav-btn" onclick="goPage('cult', this)">주거문화</div>
        <div class="nav-btn" onclick="goPage('my', this)">마이페이지</div>
    </nav>

    <div id="bc" class="container show">
        <div class="card">
            <h2>토큰/코인 발행 기준 및 관리</h2>
            <label>📍 해시 연계용 부동산 주소 (재료 1)</label>
            <input type="text" id="p-addr" value="경기도 가평군 설악면" style="font-size:18px; border:none; border-bottom:1px solid #444;">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:20px;">
                <div><label>등록 시 지급량</label><input type="text" value="500"></div>
                <div><label>환전율</label><input type="text" value="100"></div>
            </div>
            <button class="btn-blue" onclick="makeOfficialHash()">설정 저장 및 블록체인 해시 공시</button>
            <div id="hash-log">※ 공시 전: 데이터 대기 중...</div>
        </div>
    </div>

    <div id="build" class="container">
        <div class="card">
            <h3>부동산 정보 등록</h3>
            <label>거래 종류</label><select><option>건축</option><option>매매</option><option>임대</option></select>
            <label style="margin-top:20px;">주소 입력</label><input type="text" placeholder="사진 22번처럼 주소를 입력하세요.">
            <button class="btn-blue" style="background:#28a745;">정보 등록</button>
        </div>
    </div>

    <div id="virt" class="container">
        <div class="card"><h3>가상건축 제안</h3><textarea style="height:150px;" placeholder="상세 제안 내용을 입력하세요."></textarea><button class="btn-blue">제출</button></div>
    </div>

    <div id="home" class="container"><div class="card"><h3>이용 안내</h3><p>Real8 플랫폼에 오신 것을 환영합니다.</p></div></div>
    <div id="cult" class="container"><div class="card"><h3>주거문화 정보</h3><textarea style="height:200px;" placeholder="나만의 주거 문화를 공유해 주세요."></textarea></div></div>
    <div id="my" class="container"><div class="card"><h3>마이페이지</h3><p>회원님의 활동 내역입니다.</p></div></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDTz3zvah5J65zgQsik8rSeKSbhySWcCt8", authDomain: "real8-bc.firebaseapp.com", projectId: "real8-bc", appId: "1:792768508652:web:14557cae750168f46c6bc9" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function handleAuth(isJoin) {
        const e = document.getElementById('u-email').value, p = document.getElementById('u-pw').value;
        if(isJoin) {
            auth.createUserWithEmailAndPassword(e, p).then(() => alert("가입 성공! 로그인하세요.")).catch(a => alert(a.message));
        } else {
            auth.signInWithEmailAndPassword(e, p).then(r => {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('main-sys').style.display = 'block';
                document.getElementById('u-tag').innerText = r.user.email;
            }).catch(() => alert("아이디/비번 확인 필요"));
        }
    }

    function goPage(id, el) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('show'));
        document.getElementById(id).classList.add('show');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-on'));
        el.classList.add('nav-on');
    }

    function makeOfficialHash() {
        const addr = document.getElementById('p-addr').value;
        const raw = addr + "|" + window.location.href + "|" + new Date().toLocaleString();
        const hash = CryptoJS.SHA256(raw).toString();
        document.getElementById('hash-log').innerHTML = "<b>[블록체인 증명 성공]</b><br>Hash: " + hash;
        alert("해시값이 성공적으로 생성되었습니다.");
    }
</script>
</body>
</html>
